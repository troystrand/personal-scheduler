<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Scheduler</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scheduler">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --gcal: #2563eb;
      --gcal-hover: #1d4ed8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;

      /* Cognitive Color Profiles */
      --color-11: #ef4444; /* High Cognitive Tax / Tomato */
      --color-4: #f472b6;  /* Social / Flamingo */
      --color-8: #64748b;  /* Chores & Errands / Graphite */
      --color-2: #10b981;  /* Restorative / Sage */
      --color-9: #6366f1;  /* Anchor Appointments / Blueberry */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Pinned Horizon Anchors */
    .horizon-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .horizon-pill {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #c7d2fe;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      white-space: nowrap;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .horizon-pill strong { color: #fff; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    .version-tag { font-size: 0.75rem; color: var(--primary); font-weight: 600; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    textarea {
      width: 100%;
      min-height: 85px;
      background: #070d19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: 2px solid var(--primary); }

    .button-group { display: flex; gap: 10px; align-items: center; }

    button.btn-primary {
      flex: 1;
      background: var(--primary);
      color: #070d19;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    button.btn-mic {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.btn-mic.listening {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .mic-icon { width: 20px; height: 20px; fill: currentColor; }
    .mic-status { font-size: 0.8rem; color: var(--text-muted); min-height: 16px; }

    /* Energy Barometer SVG Curve */
    .barometer-container {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .barometer-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .curve-svg { width: 100%; height: 70px; overflow: visible; }

    /* Timeline Section Header */
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .timeline-title { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .badge-live { background: #064e3b; color: #6ee7b7; font-size: 0.7rem; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }

    /* Cognitive Mass Cards */
    .events-list { display: flex; flex-direction: column; gap: 10px; }
    .event-card {
      border: 1px solid var(--border);
      background: #111827;
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-left: 6px solid var(--primary);
      transition: all 0.2s ease;
      position: relative;
    }

    .event-card[data-color="11"] { border-left-color: var(--color-11); }
    .event-card[data-color="4"]  { border-left-color: var(--color-4); }
    .event-card[data-color="8"]  { border-left-color: var(--color-8); }
    .event-card[data-color="2"]  { border-left-color: var(--color-2); }
    .event-card[data-color="9"]  { border-left-color: var(--color-9); }

    .event-card.heavy-drain {
      background: repeating-linear-gradient(
        -45deg,
        #111827,
        #111827 10px,
        #1c1917 10px,
        #1c1917 20px
      );
      box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.1);
    }

    .event-card.restorative {
      border-color: #065f46;
      background: #064e3b15;
    }

    .event-card.existing {
      opacity: 0.85;
      border-style: dashed;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .event-title { font-size: 1.05rem; font-weight: 600; color: #fff; }
    .event-energy-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-drain { background: #450a0a; color: #fca5a5; }
    .badge-restore { background: #064e3b; color: #6ee7b7; }
    .badge-neutral { background: #1e293b; color: #94a3b8; }
    .badge-existing { background: #0f172a; color: #cbd5e1; border: 1px solid var(--border); }

    .event-detail { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 8px; }
    .event-detail strong { color: var(--text); }

    .plan-summary {
      font-size: 0.9rem;
      color: var(--primary);
      background: #082f49;
      border: 1px solid #0369a1;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.4;
    }

    .btn-action {
      background: var(--gcal);
      color: white;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    .btn-action:hover { background: var(--gcal-hover); }
    .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-action.success { background: var(--success); cursor: default; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Pinned Horizon Anchors -->
    <div class="horizon-bar">
      <div class="horizon-pill"><span>🎯</span> <strong>Licensure Review</strong> (5d)</div>
      <div class="horizon-pill"><span>🌲</span> <strong>Jay Cooke Trip</strong> (16d)</div>
      <div class="horizon-pill"><span>📦</span> <strong>Laser Restock</strong> (24d)</div>
    </div>

    <div class="header-row">
      <h1>Personal Scheduler</h1>
      <div class="version-tag">VERSION 2.1</div>
    </div>

    <div class="card">
      <textarea id="promptInput" placeholder="Morning dump: 'Meeting at 9, grade portfolios, lift at 1, post office run, coffee with Dalton at 3'"></textarea>
      <div class="mic-status" id="micStatus"></div>
      <div class="button-group">
        <button id="micBtn" class="btn-mic" type="button" title="Speak to dictate">
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button id="submitBtn" class="btn-primary">Process Plan</button>
      </div>
    </div>

    <!-- Active Calendar Dashboard -->
    <div id="outputContainer" class="card">
      <div class="timeline-header">
        <span class="timeline-title">Today's Schedule & Reserves</span>
        <span id="liveBadge" class="badge-live">Connecting...</span>
      </div>

      <!-- Cognitive Fuel Curve -->
      <div class="barometer-container">
        <div class="barometer-title">
          <span>Cognitive Fuel Arc</span>
          <span id="fuelScoreText">Calculating...</span>
        </div>
        <svg id="curveSvg" class="curve-svg" viewBox="0 0 400 70"></svg>
      </div>

      <div id="planSummary" class="plan-summary hidden"></div>
      <div id="eventsContainer" class="events-list"></div>
      
      <button id="saveAllBtn" class="btn-action hidden" onclick="commitPendingEvents()">Add New Events to Calendar</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';
    let combinedEvents = [];
    let pendingEvents = [];

    function formatReadableDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const months = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
      const monthIdx = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);
      return (months[monthIdx] || parts[1]) + ' ' + day;
    }

    function formatTimeComponent(timeStr) {
      if (!timeStr) return { display: '', ampm: 'am' };
      const parts = timeStr.split(':');
      let hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1] || '0', 10);
      const ampm = hour >= 12 ? 'pm' : 'am';
      hour = hour % 12 || 12;
      const minStr = minute === 0 ? '' : ':' + (minute < 10 ? '0' + minute : minute);
      return { display: hour + minStr, ampm };
    }

    function formatReadableTimeRange(startTime, endTime) {
      if (!startTime) return '';
      const start = formatTimeComponent(startTime);
      if (!endTime || endTime === startTime) return start.display + start.ampm;
      const end = formatTimeComponent(endTime);
      return start.ampm === end.ampm 
        ? start.display + '–' + end.display + end.ampm
        : start.display + start.ampm + '–' + end.display + end.ampm;
    }

    function drawFuelBarometer(events) {
      const svg = document.getElementById('curveSvg');
      const scoreText = document.getElementById('fuelScoreText');
      if (!events || events.length === 0) {
        scoreText.innerText = 'No Events Scheduled';
        scoreText.style.color = 'var(--text-muted)';
        svg.innerHTML = '<line x1="0" y1="35" x2="400" y2="35" stroke="#334155" stroke-dasharray="4" stroke-width="1" />';
        return;
      }

      let currentFuel = 85;
      const points = [{ x: 10, y: currentFuel }];
      const step = 380 / Math.max(events.length, 1);
      let minFuel = 100;

      events.forEach((ev, idx) => {
        const delta = (ev.energy_delta || 0) * 12;
        currentFuel = Math.max(15, Math.min(95, currentFuel + delta));
        if (currentFuel < minFuel) minFuel = currentFuel;
        points.push({ x: 10 + (idx + 1) * step, y: currentFuel });
      });

      if (minFuel < 35) {
        scoreText.innerText = '⚠️ Exhaustion Risk Flagged';
        scoreText.style.color = 'var(--danger)';
      } else {
        scoreText.innerText = 'Balanced Energy Distribution';
        scoreText.style.color = 'var(--success)';
      }

      const pathData = points.map((p, i) => {
        const svgY = 70 - (p.y * 0.6);
        return (i === 0 ? 'M' : 'L') + p.x + ',' + svgY;
      }).join(' ');

      const strokeColor = minFuel < 35 ? '#ef4444' : '#38bdf8';
      svg.innerHTML = `
        <line x1="0" y1="50" x2="400" y2="50" stroke="#334155" stroke-dasharray="4" stroke-width="1" />
        <path d="${pathData}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" />
        ${points.map(p => `<circle cx="${p.x}" cy="${70 - (p.y * 0.6)}" r="4" fill="${strokeColor}" />`).join('')}
      `;
    }

    function renderEvents(events) {
      const container = document.getElementById('eventsContainer');
      if (!events.length) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:0.9rem;padding:12px 0;">No calendar events yet for today. Use the box above to schedule.</div>';
        return;
      }

      // Sort combined list chronologically
      events.sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));

      container.innerHTML = events.map(ev => {
        const dateDisplay = formatReadableDate(ev.date);
        const timeDisplay = formatReadableTimeRange(ev.start_time, ev.end_time);
        const delta = ev.energy_delta || 0;

        let massClass = '';
        let badgeHtml = '';

        if (ev.is_existing) {
          massClass = 'existing';
          badgeHtml = '<span class="event-energy-badge badge-existing">On Calendar</span>';
        } else if (delta <= -2) {
          massClass = 'heavy-drain';
          badgeHtml = '<span class="event-energy-badge badge-drain">High Cognitive Tax</span>';
        } else if (delta >= 1) {
          massClass = 'restorative';
          badgeHtml = '<span class="event-energy-badge badge-restore">Restorative</span>';
        } else {
          badgeHtml = '<span class="event-energy-badge badge-neutral">Pending Add</span>';
        }

        return (
          '<div class="event-card ' + massClass + '" data-color="' + (ev.color_id || '9') + '">' +
            '<div class="event-header">' +
              '<div class="event-title">' + (ev.title || 'Event') + '</div>' +
              badgeHtml +
            '</div>' +
            '<div class="event-detail"><span>Time:</span> <strong>' + dateDisplay + ' · ' + timeDisplay + '</strong></div>' +
            (ev.location ? '<div class="event-detail"><span>Location:</span> <strong>' + ev.location + '</strong></div>' : '') +
          '</div>'
        );
      }).join('');
    }

    async function loadLiveSchedule() {
      const liveBadge = document.getElementById('liveBadge');
      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'LIST' })
        });
        const data = await response.json();
        const existing = data.events || [];
        combinedEvents = [...existing];

        liveBadge.innerText = 'Google Calendar Synced';
        liveBadge.style.background = '#064e3b';
        liveBadge.style.color = '#6ee7b7';

        drawFuelBarometer(combinedEvents);
        renderEvents(combinedEvents);
      } catch (err) {
        liveBadge.innerText = 'Sync Offline';
        liveBadge.style.background = '#450a0a';
        liveBadge.style.color = '#fca5a5';
      }
    }

    async function commitPendingEvents() {
      if (!pendingEvents.length) return;
      const saveBtn = document.getElementById('saveAllBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Writing to Calendar...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'INSERT', events: pendingEvents })
        });
        if (!response.ok) throw new Error('Insert failed');

        saveBtn.classList.add('success');
        saveBtn.innerText = '✓ Added to Calendar';

        // Reload live schedule to show newly added events as existing
        setTimeout(() => {
          pendingEvents = [];
          saveBtn.classList.add('hidden');
          loadLiveSchedule();
        }, 1200);
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Retry Adding';
        alert('Failed: ' + err.message);
      }
    }

    async function processSchedule() {
      stopVoice();
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const planSummary = document.getElementById('planSummary');
      const saveBtn = document.getElementById('saveAllBtn');

      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Sequencing Day...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        if (!response.ok) throw new Error('Planning failed');

        const data = await response.json();
        pendingEvents = data.events || [];

        if (data.summary_message) {
          planSummary.innerText = data.summary_message;
          planSummary.classList.remove('hidden');
        }

        // Merge newly parsed events into live events
        const merged = [...combinedEvents.filter(e => e.is_existing), ...pendingEvents];
        drawFuelBarometer(merged);
        renderEvents(merged);

        saveBtn.disabled = false;
        saveBtn.classList.remove('success', 'hidden');
        saveBtn.innerText = pendingEvents.length > 1 
          ? 'Add All (' + pendingEvents.length + ') to Calendar' 
          : 'Add to Calendar';

        input.value = '';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Process Plan';
      }
    }

    // Hybrid Patience Speech Recognition
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const promptInput = document.getElementById('promptInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let silenceTimer = null;
    let isListening = false;

    function resetSilenceTimer() {
      if (silenceTimer) clearTimeout(silenceTimer);
      micStatus.innerText = 'Listening... (Speak freely, 6s cushion)';
      silenceTimer = setTimeout(() => {
        if (isListening && promptInput.value.trim().length > 0) {
          micStatus.innerText = 'Sequencing...';
          processSchedule();
        }
      }, 6000);
    }

    function stopVoice() {
      if (silenceTimer) clearTimeout(silenceTimer);
      if (recognition && isListening) recognition.stop();
      isListening = false;
      micBtn.classList.remove('listening');
      micStatus.innerText = '';
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        resetSilenceTimer();
      };
      recognition.onresult = function(event) {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + ' ';
        }
        promptInput.value = transcript.trim();
        resetSilenceTimer();
      };
      recognition.onerror = function() { stopVoice(); };
      recognition.onend = function() {
        if (isListening) try { recognition.start(); } catch(e) { stopVoice(); }
      };

      micBtn.addEventListener('click', function() {
        if (isListening) stopVoice();
        else { promptInput.value = ''; try { recognition.start(); } catch(e) {} }
      });
    }

    document.getElementById('submitBtn').addEventListener('click', processSchedule);
    document.getElementById('promptInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processSchedule();
      }
    });

    // Auto-load on page start
    window.addEventListener('DOMContentLoaded', loadLiveSchedule);
  </script>
</body>
</html>
