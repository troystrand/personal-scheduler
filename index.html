<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sequencer">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Task Sequencer</title>

  <!-- iOS Standalone Full-Screen App Meta Tags -->
  <meta name="theme-color" content="#0d0708">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!--███████████████████████████████████████████████████████████████████████████
    ▼▼▼ ANCHOR: CSS_THEME_AND_LAYOUT_START ▼▼▼
████████████████████████████████████████████████████████████████████████████-->
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --ptt-orange: #f97316;
      --ptt-glow: rgba(249, 115, 22, 0.45);
      --record-red: #ef4444;

      --tag-11: #38bdf8;
      --tag-8: #a855f7;
      --tag-2: #ec4899;
      --tag-9: #10b981;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px 80px 16px;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-font-smoothing: antialiased;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }

    .view-tabs {
      display: flex;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .view-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-tab.active {
      background: var(--card-bg);
      color: var(--primary);
    }

/* DECLUTTERED FOYER: HERO HOPPER */
    .hopper-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .hopper-bar { display: flex; gap: 10px; align-items: flex-start; }
    .hopper-input-wrap { flex: 1; min-width: 0; }
    .hopper-input-wrap textarea {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
      min-height: 52px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
      transition: border-color 0.15s ease;
    }
    .hopper-input-wrap textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .btn-hopper-submit {
      background: #111c2e;
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 18px;
      height: 52px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-hopper-submit:hover { background: #0c4a6e; border-color: var(--primary); color: #fff; }
    .btn-hopper-submit.ptt-active {
      background: var(--ptt-orange) !important;
      border-color: var(--ptt-orange) !important;
      color: #fff !important;
      box-shadow: 0 0 16px var(--ptt-glow);
    }

    .hopper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 2px 2px;
    }
    .hopper-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hopper-count-badge {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 9999px;
    }
    .hopper-chevron { color: var(--text-muted); font-size: 0.7rem; }
    .hopper-tray.collapsed { display: none; }
    .hopper-items { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }

    .hopper-card {
      background: #090e17;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hopper-card.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }

    .hopper-check {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #111c2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hopper-check:checked { background: var(--primary); border-color: var(--primary); }
    .hopper-check:checked::after { content: '✓'; color: #090e17; font-size: 0.75rem; font-weight: 900; }
    .hopper-text { font-size: 0.85rem; color: var(--text-sub); flex: 1; cursor: pointer; }
    .hopper-actions { display: flex; gap: 4px; align-items: center; }
    .hopper-delete-btn { background: transparent; color: var(--text-muted); border: none; padding: 4px 6px; font-size: 0.75rem; cursor: pointer; }
    .hopper-delete-btn:hover { color: var(--record-red); }

    .hopper-batch-bar {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .btn-stage-hopper {
      flex: 1;
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-clear-selection { background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; }
    .hopper-empty { padding: 8px; text-align: center; color: var(--text-muted); font-size: 0.8rem; }

    /* WORKBENCH PANEL (PROGRESSIVE DISCLOSURE) */
    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s ease-out;
    }
    .input-panel.drawer-hidden {
      display: none !important;
    }

    .workbench-header { display: flex; justify-content: space-between; align-items: center; }
    .workbench-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
    .workbench-counter { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

    .staged-chips-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .staged-chip {
      background: #090e17;
      border: 1px solid #0284c7;
      color: #e0f2fe;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .staged-chip-remove { background: transparent; border: none; color: #7dd3fc; cursor: pointer; }

    textarea {
      width: 100%;
      min-height: 70px;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }
    textarea:focus { outline: 1px solid var(--primary); }

    .workbench-actions { display: flex; gap: 8px; align-items: center; }
    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-workbench-reset {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0 12px;
      height: 44px;
      cursor: pointer;
    }

    /* BUNDLED BLOCKS LIST */
    .blocks-container { display: flex; flex-direction: column; gap: 12px; }

    .block-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 4px solid var(--primary);
    }
    .block-card[data-color="11"] { border-left-color: var(--tag-11); }
    .block-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .block-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .block-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .block-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .block-title-row { display: flex; flex-direction: column; gap: 2px; }
    .block-title { font-size: 0.96rem; font-weight: 700; }
    .block-badge-domain {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .block-time { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    .block-atoms-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #090e17;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border);
    }

    .atom-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: #e2e8f0;
      padding: 4px 6px;
      border-radius: 4px;
      background: #111c2e;
    }
    .atom-item.done { text-decoration: line-through; opacity: 0.45; }
    .atom-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .atom-check {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #090e17;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .atom-check:checked { background: var(--primary); border-color: var(--primary); }
    .atom-check:checked::after { content: '✓'; color: #090e17; font-size: 0.65rem; font-weight: 900; }

    .atom-controls { display: flex; gap: 4px; align-items: center; }
    .btn-atom-split {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.68rem;
      cursor: pointer;
    }
    .btn-atom-split:hover { color: var(--primary); border-color: var(--primary); }

    .btn-save {
      background: #0284c7;
      color: white;
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover { background: #0369a1; }

    .track-active-banner {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* FLOATING BOTTOM DOCK */
    .floating-control-dock {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      z-index: 999;
      pointer-events: none;
    }
    .floating-control-dock > * { pointer-events: auto; }

    .floating-ab-bar {
      display: inline-flex;
      align-items: center;
      background: #090e17;
      border: 1px solid var(--primary);
      border-radius: 9999px;
      padding: 3px 6px;
      gap: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .floating-ab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .floating-ab-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .floating-ab-btn.btn-copy {
      color: var(--text-muted);
      border-left: 1px solid var(--border);
      border-radius: 0;
      padding-left: 8px;
    }

    .forge-pill {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* FORGE DRAWER */
    .forge-drawer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      max-width: 580px;
      background: #090e17;
      border-top: 2px solid var(--primary);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
      z-index: 1000;
      height: 70vh;
      height: 70dvh;
      display: flex;
      flex-direction: column;
      border-radius: 14px 14px 0 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      overflow: hidden;
    }

    .forge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
      border-radius: 14px 14px 0 0;
      width: 100%;
      flex-shrink: 0;
    }
    .forge-title { font-size: 0.82rem; font-weight: 700; color: var(--primary); }
    .forge-header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0 4px; }

    .forge-chat-log {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    /* REFINED CHAT BUBBLES */
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.45;
      font-size: 0.84rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .chat-msg pre, .chat-msg code {
      max-width: 100%;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 14px 14px 2px 14px;
      border: 1px solid var(--border);
      max-width: 84%;
      width: fit-content;
    }
    .chat-msg.model {
      align-self: flex-start;
      background: #131c2e;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 2px;
      border: 1px solid #1e293b;
      max-width: 88%;
      width: fit-content;
    }

    /* TYPING INDICATOR BUBBLE & KEYFRAMES */
    #typingIndicator {
      align-self: flex-start;
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 14px 14px 14px 2px;
      padding: 10px 14px;
      width: fit-content;
    }
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 14px;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.4;
      animation: typingBlink 1.4s infinite both;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBlink {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.85);
      }
      40% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* THE INPUT BAR */
    .forge-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px;
      border-top: 1px solid var(--border);
      background: #0f172a;
      flex-shrink: 0;
    }
    .forge-input-bar input {
      flex: 1 1 auto;
      width: 50%;
      min-width: 0;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 12px;
      font-size: 16px;
    }
    .forge-input-bar button {
      flex: 0 0 68px;
      width: 68px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 0;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .hidden { display: none !important; }
  </style>
<!--███████████████████████████████████████████████████████████████████████████

</head>
<body>




  
<!--███████████████████████████████████████████████████████████████████████████
    ▼▼▼ ANCHOR: DOM_STRUCTURE_START ▼▼▼
████████████████████████████████████████████████████████████████████████████-->
  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <div class="view-tabs">
        <button type="button" class="view-tab active" id="tabPlan" onclick="switchView('plan')">Plan &amp; Bundle</button>
        <button type="button" class="view-tab" id="tabTrack" onclick="switchView('track')">Track Today</button>
      </div>
    </header>

    <!-- VIEW 1: PLANNING & BUNDLING -->
    <div id="viewPlan">
      <!-- DYNAMIC ROLLING DATE STRIP -->
      <div class="date-strip-wrapper" style="display: flex; gap: 6px; align-items: center; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px;">
        <div id="dateStripPills" style="display: flex; gap: 6px; flex: 1;"></div>
        <input 
          type="date" 
          id="customDatePicker" 
          style="background: #090e17; border: 1px solid var(--border); color: var(--text-sub); border-radius: 8px; padding: 6px 8px; font-size: 0.78rem;" 
          onchange="selectSpecificDate(this.value)"
        />
      </div>

      <!-- THE MINIMAL HERO HOPPER -->
      <section class="hopper-section">
        <div class="hopper-bar">
          <div class="hopper-input-wrap">
            <textarea 
              id="hopperInput" 
              placeholder="Quick dump (commas or Shift+Enter to split)..." 
              rows="1"
              autocomplete="off"
            ></textarea>
          </div>
          <button type="button" id="hopperAddBtn" class="btn-hopper-submit">Capture</button>
        </div>

        <div class="hopper-header" id="toggleHopperTray">
          <span class="hopper-title">
            <span>The Hopper</span>
            <span class="hopper-count-badge" id="hopperCount">0</span>
          </span>
          <span class="hopper-chevron" id="hopperChevron">▼</span>
        </div>

        <div class="hopper-tray collapsed" id="hopperTray">
          <div id="hopperList" class="hopper-items"></div>
        </div>
      </section>

      <!-- TODAY'S WORKBENCH (COLLAPSED BY DEFAULT) -->
      <section class="input-panel drawer-hidden" id="workbenchPanel" style="margin-top: 14px;">
        <div class="workbench-header">
          <span class="workbench-label" id="workbenchLabel">Today's Workbench</span>
          <span class="workbench-counter" id="workbenchCount">0 items staged</span>
        </div>

        <div id="stagedChips" class="staged-chips-container hidden"></div>

        <textarea 
          id="promptInput"

<!--███████████████████████████████████████████████████████████████████████████

  <script>
    const WORKER_URL = 'https://personal-scheduler-proxy.strand-troy.workers.dev';
    const APP_KEY = 'sequencer-lock-52984'; // Replace with your actual Cloudflare CLIENT_ACCESS_KEY
    let currentEvents = [];




    
/*█████████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: TASK_CARD_RENDER_START ▼▼▼
█████████████████████████████████████████████████████████████████████████████*/
    function getLocalDateString(offsetDays = 0, baseDate = new Date()) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let activePlanDate = getLocalDateString(0);
    let currentBlocks = JSON.parse(localStorage.getItem('current_blocks') || '[]');
    let currentView = localStorage.getItem('current_view') || 'plan';

    // Auto-rollover: push unfinished blocks from earlier dates into today
    const todayStr = getLocalDateString(0);
    let stateDirty = false;
    currentBlocks = currentBlocks.map(blk => {
      if (!blk.date) {
        blk.date = todayStr;
        stateDirty = true;
      }
      const hasPendingAtoms = (blk.atoms || []).some(a => !a.done);
      if (blk.date < todayStr && hasPendingAtoms) {
        blk.date = todayStr;
        stateDirty = true;
      }
      return blk;
    });
    if (stateDirty) {
      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
    }

    // Render Rolling Date Selector Strip
    function renderDateStrip() {
      const container = document.getElementById('dateStripPills');
      const picker = document.getElementById('customDatePicker');
      if (!container) return;

      const daysToShow = [
        { label: 'Today', offset: 0 },
        { label: 'Tomorrow', offset: 1 },
        { label: '+2d', offset: 2 },
        { label: '+3d', offset: 3 },
        { label: '+4d', offset: 4 }
      ];

      container.innerHTML = daysToShow.map(item => {
        const dStr = getLocalDateString(item.offset);
        const isActive = dStr === activePlanDate;
        return `
          <button 
            type="button" 
            class="view-tab ${isActive ? 'active' : ''}" 
            style="white-space: nowrap; flex: 1; padding: 6px 10px;"
            onclick="selectSpecificDate('${dStr}')"
          >
            ${item.label}
          </button>
        `;
      }).join('');

      if (picker) picker.value = activePlanDate;

      const wbLabel = document.getElementById('workbenchLabel');
      if (wbLabel) {
        wbLabel.textContent = activePlanDate === todayStr ? "Today's Workbench" : `Workbench (${activePlanDate})`;
      }
    }

    window.selectSpecificDate = function(dateStr) {
      if (!dateStr) return;
      activePlanDate = dateStr;
      renderDateStrip();
      renderBlocks();
    };

    window.switchView = function(viewName) {
      currentView = viewName;
      localStorage.setItem('current_view', viewName);

      const tabPlan = document.getElementById('tabPlan');
      const tabTrack = document.getElementById('tabTrack');
      const viewPlan = document.getElementById('viewPlan');
      const viewTrack = document.getElementById('viewTrack');

      if (tabPlan) tabPlan.classList.toggle('active', viewName === 'plan');
      if (tabTrack) tabTrack.classList.toggle('active', viewName === 'track');
      if (viewPlan) viewPlan.classList.toggle('hidden', viewName !== 'plan');
      if (viewTrack) viewTrack.classList.toggle('hidden', viewName !== 'track');

      if (viewName === 'track') {
        renderTrackView();
      } else {
        renderDateStrip();
        renderBlocks();
      }
    };

    let hopperItems = JSON.parse(localStorage.getItem('hopper_items') || '[]');
    let selectedHopperIds = new Set();
    let stagedWorkbenchTasks = JSON.parse(localStorage.getItem('staged_workbench_tasks') || '[]');

    function saveHopper() {
      localStorage.setItem('hopper_items', JSON.stringify(hopperItems));
      renderHopper();
    }

    function renderHopper() {
      const listEl = document.getElementById('hopperList');
      const countEl = document.getElementById('hopperCount');
      if (!listEl || !countEl) return;

      countEl.textContent = hopperItems.length;

      if (hopperItems.length === 0) {
        listEl.innerHTML = '<div class="hopper-empty">Hopper is clear. Mind is free.</div>';
        selectedHopperIds.clear();
        return;
      }

      const stagedIdSet = new Set(stagedWorkbenchTasks.map(t => t.id));

      const itemsMarkup = hopperItems.map((item) => {
        const isStaged = stagedIdSet.has(item.id);
        const isChecked = selectedHopperIds.has(item.id);

        return `
          <div class="hopper-card ${isChecked ? 'selected' : ''} ${isStaged ? 'staged-in-plan' : ''}" id="card_${item.id}" style="${isStaged ? 'opacity: 0.65; border-style: solid; border-color: var(--primary); background: rgba(56, 189, 248, 0.04);' : ''}">
            <input 
              type="checkbox" 
              class="hopper-check" 
              ${isChecked ? 'checked' : ''} 
              ${isStaged ? 'disabled style="cursor: not-allowed; opacity: 0.4;"' : ''}
              onchange="toggleHopperSelection('${item.id}', this.checked)"
            />
            <span class="hopper-text" onclick="${isStaged ? '' : `toggleHopperCheckbox('${item.id}')`}">
              ${item.rawText}
            </span>
            ${isStaged ? '<span style="font-size: 0.65rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; background: rgba(56, 189, 248, 0.12); padding: 2px 6px; border-radius: 4px; white-space: nowrap;">⚡ Staged</span>' : ''}
            <div class="hopper-actions">
              <button class="hopper-delete-btn" onclick="deleteHopperItem('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');

      const count = selectedHopperIds.size;
      const batchBar = count > 0 ? `
        <div class="hopper-batch-bar">
          <button class="btn-stage-hopper" onclick="stageSelectedHopperItems()">
            Pull ${count} into Plan ➔
          </button>
          <button class="btn-clear-selection" onclick="clearHopperSelection()">Deselect</button>
        </div>
      ` : '';

      listEl.innerHTML = itemsMarkup + batchBar;
    }

    window.toggleHopperSelection = function(id, isSelected) {
      if (isSelected) selectedHopperIds.add(id);
      else selectedHopperIds.delete(id);
      renderHopper();
    };

    window.toggleHopperCheckbox = function(id) {
      window.toggleHopperSelection(id, !selectedHopperIds.has(id));
    };

    window.clearHopperSelection = function() {
      selectedHopperIds.clear();
      renderHopper();
    };

    window.stageSelectedHopperItems = function() {
      if (selectedHopperIds.size === 0) return;

      const itemsToStage = hopperItems.filter(item => selectedHopperIds.has(item.id));
      itemsToStage.forEach(item => {
        if (!stagedWorkbenchTasks.some(t => t.id === item.id)) {
          stagedWorkbenchTasks.push({ id: item.id, text: item.rawText });
        }
      });

      localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
      selectedHopperIds.clear();
      renderHopper();
      renderWorkbench();

      const tray = document.getElementById('hopperTray');
      const chevron = document.getElementById('hopperChevron');
      if (tray && !tray.classList.contains('collapsed')) {
        tray.classList.add('collapsed');
        if (chevron) chevron.textContent = '▼';
      }
    };

    function renderWorkbench() {
      const panel = document.getElementById('workbenchPanel');
      const container = document.getElementById('stagedChips');
      const countLabel = document.getElementById('workbenchCount');
      const submitBtn = document.getElementById('submitBtn');
      if (!panel || !container || !countLabel || !submitBtn) return;

      const count = stagedWorkbenchTasks.length;
      countLabel.textContent = `${count} staged obligation${count === 1 ? '' : 's'}`;

      if (count === 0) {
        panel.classList.add('drawer-hidden');
        container.innerHTML = '';
        submitBtn.innerText = '⚡ Bundle & Sequence';
      } else {
        panel.classList.remove('drawer-hidden');
        container.innerHTML = stagedWorkbenchTasks.map((t, idx) => `
          <div class="staged-chip">
            <span class="staged-chip-text" title="${t.text}">${t.text}</span>
            <button type="button" class="staged-chip-remove" onclick="removeStagedTask(${idx})">✕</button>
          </div>
        `).join('');
        submitBtn.innerText = `⚡ Bundle ${count} Item${count === 1 ? '' : 's'}`;
      }
    }

    window.removeStagedTask = function(index) {
      stagedWorkbenchTasks.splice(index, 1);
      localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
      renderHopper();
      renderWorkbench();
    };

    window.resetWorkbench = function() {
      stagedWorkbenchTasks = [];
      localStorage.removeItem('staged_workbench_tasks');
      const promptInput = document.getElementById('promptInput');
      if (promptInput) promptInput.value = '';
      renderHopper();
      renderWorkbench();
    };

    window.parseHopperInput = async function(audioPayload = null) {
      const input = document.getElementById('hopperInput');
      const btn = document.getElementById('hopperAddBtn');
      const text = input ? input.value.trim() : '';

      if (!text && !audioPayload) return;

      btn.disabled = true;
      btn.innerText = audioPayload ? 'Transcribing...' : 'Extracting...';

      const requestBody = { action: 'HOPPER_PARSE' };
      if (audioPayload) {
        requestBody.audioData = audioPayload.data;
        requestBody.mimeType = audioPayload.mimeType;
      }
      if (text) requestBody.text = text;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify(requestBody)
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const extracted = data.items || [];

        if (extracted.length > 0) {
          extracted.forEach(str => {
            hopperItems.unshift({
              id: 'hop_' + Date.now() + Math.random().toString(36).substr(2, 4),
              rawText: str,
              createdAt: new Date().toISOString()
            });
          });
        } else if (text) {
          hopperItems.unshift({
            id: 'hop_' + Date.now(),
            rawText: text,
            createdAt: new Date().toISOString()
          });
        }

        if (input) input.value = '';
        saveHopper();

        const tray = document.getElementById('hopperTray');
        const chevron = document.getElementById('hopperChevron');
        if (tray && tray.classList.contains('collapsed')) {
          tray.classList.remove('collapsed');
          if (chevron) chevron.textContent = '▲';
        }
      } catch (err) {
        console.error('Hopper Ingestion Error:', err);
        if (text) {
          hopperItems.unshift({
            id: 'hop_' + Date.now(),
            rawText: text,
            createdAt: new Date().toISOString()
          });
          if (input) input.value = '';
          saveHopper();
        } else {
          alert('Intake failed: ' + err.message);
        }
      } finally {
        btn.disabled = false;
        btn.innerText = 'Capture';
      }
    };

    window.deleteHopperItem = function(id) {
      hopperItems = hopperItems.filter(item => item.id !== id);
      selectedHopperIds.delete(id);
      stagedWorkbenchTasks = stagedWorkbenchTasks.filter(item => item.id !== id);
      localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
      saveHopper();
      renderWorkbench();
    };

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      const m = parts[1] || '00';
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${m}${ampm}`;
    }

    // Flexible Date Mover for Blocks
    window.moveBlockToDate = function(blkId, targetDate) {
      const blk = currentBlocks.find(b => b.id === blkId);
      if (!blk) return;
      blk.date = targetDate;
      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      renderBlocks();
    };

    window.promptMoveBlock = function(blkId) {
      const target = prompt('Enter date (YYYY-MM-DD) or "+1", "+2":');
      if (!target) return;
      let finalDate = target;
      if (target.startsWith('+')) {
        const offset = parseInt(target.replace('+', ''), 10) || 1;
        finalDate = getLocalDateString(offset);
      }
      moveBlockToDate(blkId, finalDate);
    };

    function renderBlocks() {
      const container = document.getElementById('blocksContainer');
      const saveBtn = document.getElementById('saveBtn');
      if (!container) return;

      const visibleBlocks = currentBlocks.filter(b => (b.date || todayStr) === activePlanDate);

      if (!visibleBlocks.length) {
        container.innerHTML = `<div class="hopper-empty">No blocks scheduled for ${activePlanDate === todayStr ? 'today' : activePlanDate}.</div>`;
        if (saveBtn) saveBtn.classList.add('hidden');
        return;
      }

      const tomorrowStr = getLocalDateString(1);

      container.innerHTML = visibleBlocks.map((blk) => {
        const timeDisplay = `${formatTime12(blk.start_time)} – ${formatTime12(blk.end_time)}`;
        const atoms = blk.atoms || [];

        return `
          <div class="block-card" data-color="${blk.color_id || '9'}">
            <div class="block-header">
              <div class="block-title-row">
                <span class="block-badge-domain">${blk.domain || 'Batch'}</span>
                <div class="block-title">${blk.title}</div>
              </div>
              <div style="display: flex; gap: 6px; align-items: center;">
                <span class="block-time">${timeDisplay}</span>
                <button type="button" class="btn-atom-split" onclick="moveBlockToDate('${blk.id}', '${activePlanDate === todayStr ? tomorrowStr : todayStr}')">
                  ${activePlanDate === todayStr ? '→ Tmrw' : '← Today'}
                </button>
                <button type="button" class="btn-atom-split" title="Move to specific date" onclick="promptMoveBlock('${blk.id}')">📅</button>
              </div>
            </div>

            <div class="block-atoms-list">
              ${atoms.map((atom, atomIdx) => `
                <div class="atom-item ${atom.done ? 'done' : ''}">
                  <div class="atom-left">
                    <span>${atom.text}</span>
                  </div>
                  <div class="atom-controls">
                    <span style="font-size:0.7rem;color:var(--text-muted);">${atom.est_minutes || 15}m</span>
                    <button class="btn-atom-split" title="Split into Standalone Block" onclick="splitAtomToBlock('${blk.id}',${atomIdx})">⚡ Standalone</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      if (saveBtn) saveBtn.classList.remove('hidden');
    }

    window.splitAtomToBlock = function(blkId, atomIdx) {
      const blkIndex = currentBlocks.findIndex(b => b.id === blkId);
      if (blkIndex === -1) return;
      const sourceBlock = currentBlocks[blkIndex];
      const [atom] = sourceBlock.atoms.splice(atomIdx, 1);

      const newBlock = {
        id: 'blk_' + Date.now() + Math.random().toString(36).substr(2, 4),
        title: atom.text,
        domain: sourceBlock.domain,
        date: sourceBlock.date || activePlanDate,
        start_time: sourceBlock.start_time,
        end_time: sourceBlock.end_time,
        duration_minutes: atom.est_minutes || 30,
        color_id: sourceBlock.color_id,
        is_standalone: true,
        atoms: [atom]
      };

      currentBlocks.splice(blkIndex + 1, 0, newBlock);

      if (sourceBlock.atoms.length === 0) {
        currentBlocks.splice(blkIndex, 1);
      }

      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      renderBlocks();
    };

    // --- REFINED TRACK MODE: ACTIVE NOW + METRICS ---
    function renderTrackView() {
      const container = document.getElementById('trackBlocksContainer');
      const banner = document.getElementById('trackActiveBanner');
      const progressText = document.getElementById('trackProgressText');
      const progressBar = document.getElementById('trackProgressBar');
      if (!container) return;

      const todayBlocks = currentBlocks.filter(b => (b.date || todayStr) === todayStr);

      if (!todayBlocks.length) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;">No blocks scheduled for today. Head to Plan &amp; Bundle to sequence your tasks.</div>';
        if (banner) banner.classList.add('hidden');
        if (progressText) progressText.textContent = '0% Completed';
        if (progressBar) progressBar.style.width = '0%';
        return;
      }

      // Calculate Day Progress
      let totalAtoms = 0;
      let doneAtoms = 0;
      todayBlocks.forEach(b => {
        (b.atoms || []).forEach(a => {
          totalAtoms++;
          if (a.done) doneAtoms++;
        });
      });
      const pct = totalAtoms > 0 ? Math.round((doneAtoms / totalAtoms) * 100) : 0;
      if (progressText) progressText.textContent = `${doneAtoms} / ${totalAtoms} Done (${pct}%)`;
      if (progressBar) progressBar.style.width = `${pct}%`;

      // Identify Current Active Block by Time
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let activeBlock = null;
      todayBlocks.forEach(blk => {
        if (!blk.start_time || !blk.end_time) return;
        const [sh, sm] = blk.start_time.split(':').map(Number);
        const [eh, em] = blk.end_time.split(':').map(Number);
        const startMin = sh * 60 + sm;
        const endMin = eh * 60 + em;

        if (currentMinutes >= startMin && currentMinutes <= endMin) {
          activeBlock = blk;
        }
      });

      // Render Active Banner
      if (banner) {
        if (activeBlock) {
          banner.classList.remove('hidden');
          banner.innerHTML = `
            <div style="font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--primary);">● Active Right Now (${formatTime12(activeBlock.start_time)} – ${formatTime12(activeBlock.end_time)})</div>
            <div style="font-size:1.05rem; font-weight:700; color:#fff; margin-top:2px;">${activeBlock.title}</div>
            <div style="font-size:0.8rem; color:#bae6fd; margin-top:4px;">${activeBlock.atoms.filter(a => !a.done).length} unfinished atoms remaining</div>
          `;
        } else {
          banner.classList.add('hidden');
        }
      }

      // Render Blocks with Distinct Done/Active Styling
      container.innerHTML = todayBlocks.map((blk) => {
        const timeDisplay = `${formatTime12(blk.start_time)} – ${formatTime12(blk.end_time)}`;
        const atoms = blk.atoms || [];
        const isBlockDone = atoms.length > 0 && atoms.every(a => a.done);

        return `
          <div class="block-card ${isBlockDone ? 'block-completed' : ''}" data-color="${blk.color_id || '9'}" style="${isBlockDone ? 'opacity: 0.55;' : ''}">
            <div class="block-header">
              <div class="block-title-row">
                <span class="block-badge-domain">${blk.domain}</span>
                <div class="block-title" style="${isBlockDone ? 'text-decoration: line-through;' : ''}">${blk.title}</div>
              </div>
              <span class="block-time">${timeDisplay}</span>
            </div>

            <div class="block-atoms-list">
              ${atoms.map((atom, atomIdx) => `
                <div class="atom-item ${atom.done ? 'done' : ''}">
                  <div class="atom-left">
                    <input 
                      type="checkbox" 
                      class="atom-check" 
                      ${atom.done ? 'checked' : ''} 
                      onchange="toggleAtomDone('${blk.id}',${atomIdx}, this.checked)"
                    />
                    <span>${atom.text}</span>
                  </div>
                  <span style="font-size:0.7rem;color:var(--text-muted);">${atom.est_minutes || 15}m</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleAtomDone = function(blkId, atomIdx, isDone) {
      const blk = currentBlocks.find(b => b.id === blkId);
      if (!blk || !blk.atoms || !blk.atoms[atomIdx]) return;
      blk.atoms[atomIdx].done = isDone;
      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      renderTrackView();
    };

/*█████████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: TASK_SORTING_LOGIC_START ▼▼▼
█████████████████████████████████████████████████████████████████████████████*/
    window.moveBlock = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentBlocks.length) return;

      const item = currentBlocks.splice(index, 1)[0];
      currentBlocks.splice(targetIndex, 0, item);

      if (currentBlocks.length > 0) {
        let [currentH, currentM] = (currentBlocks[0].start_time || '08:00').split(':').map(Number);

        currentBlocks.forEach(blk => {
          const duration = blk.duration_minutes || 30;
          const startStr = `${String(currentH).padStart(2, '0')}:${String(currentM).padStart(2, '0')}`;

          let endTotalMin = currentH * 60 + currentM + duration;
          let endH = Math.floor(endTotalMin / 60) % 24;
          let endM = endTotalMin % 60;
          const endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

          blk.start_time = startStr;
          blk.end_time = endStr;

          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      renderBlocks();
    };

/*███████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: TASK_API_PARSING_AND_SAVE_START ▼▼▼
█████████████████████████████████████████████████████████████████████████████*/
    async function parseTasks() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const contextText = input ? input.value.trim() : '';

      if (stagedWorkbenchTasks.length === 0 && !contextText) {
        alert('Stage some items from The Hopper or type your plan first.');
        return;
      }

      const originalBtnText = btn.innerText;
      btn.disabled = true;
      btn.innerText = 'Bundling...';

      let promptParts = [];
      promptParts.push(`Target Execution Date: ${activePlanDate}`);
      if (stagedWorkbenchTasks.length > 0) {
        promptParts.push('Obligations to bundle and sequence:\n' + stagedWorkbenchTasks.map(t => `- ${t.text}`).join('\n'));
      }
      if (contextText) {
        promptParts.push(`Daily anchors and context:\n${contextText}`);
      }

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ prompt: promptParts.join('\n\n') })
        });

        const raw = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

        const data = JSON.parse(raw);
        const incomingBlocks = (data.blocks || []).map(b => ({
          ...b,
          id: b.id || 'blk_' + Date.now() + Math.random().toString(36).substr(2, 4),
          date: b.date || activePlanDate,
          atoms: (b.atoms || []).map(a => typeof a === 'string' 
            ? { text: a, done: false, est_minutes: 15 } 
            : { text: a.text, done: !!a.done, est_minutes: a.est_minutes || 15 }
          )
        }));

        currentBlocks = [...currentBlocks, ...incomingBlocks];
        localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));

        renderBlocks();

        const sequencedIds = stagedWorkbenchTasks.map(t => t.id);
        hopperItems = hopperItems.filter(item => !sequencedIds.includes(item.id));
        saveHopper();
        resetWorkbench();
      } catch (err) {
        alert('Bundling failed: ' + err.message);
        btn.innerText = originalBtnText;
      } finally {
        btn.disabled = false;
      }
    }

    async function saveToCalendar() {
      const activeBlocks = currentBlocks.filter(b => (b.date || todayStr) === activePlanDate);
      if (!activeBlocks.length) return;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Writing to Calendar...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ action: 'INSERT', blocks: activeBlocks })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Failed to save to Google Calendar/Sheets');
        }

        saveBtn.innerText = '✓ Saved to Calendar!';
        setTimeout(() => {
          saveBtn.disabled = false;
          switchView('track');
        }, 800);
      } catch (err) {
        alert(err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Write Schedule to Calendar & Start Tracking';
      }
    }

/*█████████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: FORGE_CHAT_CLIENT_START ▼▼▼

    let forgeHistory = JSON.parse(localStorage.getItem('forge_history') || '[]');
    let latestVariantProposal = null; // Stores { codeA, codeB } from the most recent proposal
    let currentDockChoice = 'orig';    // 'orig' | 'a' | 'b'

    function toggleForge() {
      const drawer = document.getElementById('forgeDrawer');
      if (!drawer) return;
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        renderForgeLog();
        const input = document.getElementById('forgeInput');
        if (input) input.focus();
      }
    }

    function renderForgeLog() {
      const container = document.getElementById('forgeChatLog');
      if (!container) return;
      container.innerHTML = '';

      if (forgeHistory.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;padding:12px;">Ask Gemini for design variants. A persistent [Orig | A | B] switcher will dock next to ✦ Forge so you can test them with the drawer closed.</div>';
        return;
      }

      forgeHistory.forEach((msg, idx) => {
        const role = msg.role === 'model' ? 'model' : 'user';
        const text = msg.parts?.[0]?.text || '';
        appendChatMessageToDOM(role, text, idx);
      });

      container.scrollTop = container.scrollHeight;
    }

    function appendChatMessageToDOM(role, text, index) {
      const container = document.getElementById('forgeChatLog');
      if (!container) return;
      const msgEl = document.createElement('div');
      msgEl.className = `chat-msg ${role}`;

      if (role === 'model') {
        let formattedText = text;

        // Auto-wrap bare code fences into <details> dropdowns
        if (!formattedText.includes('<details>') && (formattedText.includes('```css') || formattedText.includes('```javascript'))) {
          formattedText = formattedText.replace(/(```[\s\S]*?```)/g, '<details style="margin-top:6px;background:#090e17;padding:6px 10px;border-radius:6px;border:1px solid var(--border);"><summary style="cursor:pointer;font-size:0.75rem;color:var(--text-muted);font-weight:600;">View Raw Code</summary>$1</details>');
        }

        msgEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(formattedText) : formattedText;

        // Extract Option A and Option B
        const codeA = extractVariantCode(text, 'a');
        const codeB = extractVariantCode(text, 'b');

        if (codeA || codeB) {
          latestVariantProposal = { codeA, codeB };
          updateFloatingDockVisibility(true);
        }
      } else {
        msgEl.innerText = text;
      }

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    function extractVariantCode(rawText, variantKey) {
      if (variantKey === 'a') {
        const matchA = rawText.match(/```css-variant-a([\s\S]*?)```/);
        if (matchA) return matchA[1].trim();
        const firstMatch = rawText.match(/```(?:css)?([\s\S]*?)```/);
        return firstMatch ? firstMatch[1].trim() : '';
      }
      if (variantKey === 'b') {
        const matchB = rawText.match(/```css-variant-b([\s\S]*?)```/);
        if (matchB) return matchB[1].trim();
        const allMatches = [...rawText.matchAll(/```(?:css)?([\s\S]*?)```/g)];
        if (allMatches.length >= 2) return allMatches[1][1].trim();
      }
      return '';
    }

    function updateFloatingDockVisibility(visible) {
      const dockBar = document.getElementById('floatingAbBar');
      if (!dockBar) return;
      dockBar.classList.toggle('hidden', !visible);
    }

    window.applyVariantFromDock = function(choice) {
      currentDockChoice = choice;

      document.getElementById('btnDockOrig')?.classList.toggle('active', choice === 'orig');
      document.getElementById('btnDockA')?.classList.toggle('active', choice === 'a');
      document.getElementById('btnDockB')?.classList.toggle('active', choice === 'b');

      const styleId = 'forge-active-variant-style';
      let styleTag = document.getElementById(styleId);

      if (choice === 'orig' || !latestVariantProposal) {
        if (styleTag) styleTag.remove();
        if (typeof switchView === 'function') switchView(currentView);
        return;
      }

      const code = choice === 'a' ? latestVariantProposal.codeA : latestVariantProposal.codeB;
      if (code) {
        if (!styleTag) {
          styleTag = document.createElement('style');
          styleTag.id = styleId;
          document.head.appendChild(styleTag);
        }
        styleTag.innerHTML = code;
      }
    };

    window.copyCurrentActiveDock = async function() {
      if (!latestVariantProposal) return;
      const code = currentDockChoice === 'b' ? latestVariantProposal.codeB : latestVariantProposal.codeA;
      if (!code) {
        alert('No active variant code to copy.');
        return;
      }

      const btn = document.getElementById('btnDockCopy');
      try {
        await navigator.clipboard.writeText(code);
        if (btn) {
          btn.innerText = `✓ ${currentDockChoice.toUpperCase()}`;
          setTimeout(() => { btn.innerText = '📋 Copy'; }, 1500);
        }
      } catch (err) {
        alert('Copy failed: ' + err.message);
      }
    };

    async function sendForgeMessage() {
      const input = document.getElementById('forgeInput');
      const btn = document.getElementById('forgeSendBtn');
      if (!input || !btn) return;
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;

      forgeHistory.push({ role: 'user', parts: [{ text }] });
      renderForgeLog();

      const container = document.getElementById('forgeChatLog');
      const typingEl = document.createElement('div');
      typingEl.id = 'typingIndicator';
      typingEl.className = 'chat-msg model';
      typingEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      container.appendChild(typingEl);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ action: 'DEV_FORGE', history: forgeHistory })
        });

        const data = await res.json();
        document.getElementById('typingIndicator')?.remove();

        const reply = data.response || 'No response returned.';
        forgeHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (forgeHistory.length > 30) forgeHistory = forgeHistory.slice(-30);
        localStorage.setItem('forge_history', JSON.stringify(forgeHistory));

        renderForgeLog();
      } catch (err) {
        document.getElementById('typingIndicator')?.remove();
        appendChatMessageToDOM('model', `**Error:** ${err.message}`, 9999);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    function clearForgeChat() {
      if (!confirm('Clear Forge conversation history?')) return;
      forgeHistory = [];
      latestVariantProposal = null;
      currentDockChoice = 'orig';
      const activeStyle = document.getElementById('forge-active-variant-style');
      if (activeStyle) activeStyle.remove();
      updateFloatingDockVisibility(false);
      localStorage.removeItem('forge_history');
      renderForgeLog();
    }

/*█████████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: VOICE_RECOGNITION_SETUP_START ▼▼▼
█████████████████████████████████████████████████████████████████████████████*/
    const submitBtn = document.getElementById('submitBtn');
    const promptInput = document.getElementById('promptInput');
    const hopperAddBtn = document.getElementById('hopperAddBtn');
    const hopperInput = document.getElementById('hopperInput');

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecordingPTT = false;
    let recordingTimer = null;
    let currentStream = null;

    function getSupportedMimeType() {
      const candidates = [
        'audio/mp4',
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/aac'
      ];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return '';
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const res = reader.result;
          resolve(res.split(',')[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function attachHardwarePTT(buttonEl, onAudioCaptured, onShortTap) {
      if (!buttonEl) return;
      const originalText = buttonEl.innerText;

      buttonEl.addEventListener('click', async (e) => {
        e.preventDefault();

        if (!isRecordingPTT) {
          const input = document.getElementById('hopperInput');
          if (input && input.value.trim().length > 0) {
            onShortTap();
            return;
          }

          try {
            currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } catch (err) {
            alert('Microphone access unavailable or denied: ' + err.message);
            return;
          }

          isRecordingPTT = true;
          buttonEl.classList.add('ptt-active');
          buttonEl.innerText = 'Done';

          const mimeType = getSupportedMimeType();
          audioChunks = [];

          try {
            mediaRecorder = mimeType ? new MediaRecorder(currentStream, { mimeType }) : new MediaRecorder(currentStream);
          } catch (e) {
            mediaRecorder = new MediaRecorder(currentStream);
          }

          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) {
              audioChunks.push(ev.data);
            }
          };

          mediaRecorder.onstop = async () => {
            if (currentStream) {
              currentStream.getTracks().forEach(t => t.stop());
              currentStream = null;
            }
            buttonEl.classList.remove('ptt-active');
            buttonEl.innerText = originalText;

            if (audioChunks.length === 0) return;

            const finalMime = mediaRecorder.mimeType || mimeType || 'audio/mp4';
            const audioBlob = new Blob(audioChunks, { type: finalMime });

            try {
              const base64Data = await blobToBase64(audioBlob);
              onAudioCaptured({ data: base64Data, mimeType: finalMime });
            } catch (encodeErr) {
              alert('Failed to process audio: ' + encodeErr.message);
            }
          };

          mediaRecorder.start(250);
        } else {
          isRecordingPTT = false;
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try { mediaRecorder.requestData(); } catch (err) {}
            mediaRecorder.stop();
          }
        }
      });
    }
    
    // Attach PTT to Hopper Capture
    attachHardwarePTT(
      hopperAddBtn,
      (audioPayload) => parseHopperInput(audioPayload),
      () => parseHopperInput()
    );

    // Sequence tap
    if (submitBtn) {
      submitBtn.onclick = () => parseTasks();
    }

    // Auto-resize helper
    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      if (el.scrollHeight > 120) {
        el.style.overflowY = 'auto';
      } else {
        el.style.overflowY = 'hidden';
      }
    }

    // Hopper Shift+Enter listener
    if (hopperInput) {
      hopperInput.addEventListener('input', () => autoResizeTextarea(hopperInput));
      hopperInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (e.shiftKey) {
            setTimeout(() => autoResizeTextarea(hopperInput), 0);
          } else {
            e.preventDefault();
            parseHopperInput();
            hopperInput.style.height = '52px';
          }
        }
      });
    }

    // Forge Drawer Shift+Enter listener
    const forgeInput = document.getElementById('forgeInput');
    if (forgeInput) {
      forgeInput.addEventListener('input', () => autoResizeTextarea(forgeInput));
      forgeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (e.shiftKey) {
            setTimeout(() => autoResizeTextarea(forgeInput), 0);
          } else {
            e.preventDefault();
            sendForgeMessage();
            forgeInput.style.height = '40px';
          }
        }
      });
    }

    // Hopper Tray Toggle
    const toggleHopperBtn = document.getElementById('toggleHopperTray');
    if (toggleHopperBtn) {
      toggleHopperBtn.addEventListener('click', () => {
        const tray = document.getElementById('hopperTray');
        const chevron = document.getElementById('hopperChevron');
        if (tray) {
          const isCollapsed = tray.classList.toggle('collapsed');
          if (chevron) chevron.textContent = isCollapsed ? '▼' : '▲';
        }
      });
    }

    // BOOT SEQUENCE: Explicitly enforces progressive disclosure on fresh load
    renderHopper();
    renderWorkbench();
    switchView(currentView);
