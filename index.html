<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sequencer">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Task Sequencer</title>

  <!-- iOS Standalone Full-Screen App Meta Tags -->
  <meta name="theme-color" content="#0d0708">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!--███████████████████████████████████████████████████████████████████████████
    ▼▼▼ ANCHOR: CSS_THEME_AND_LAYOUT_START ▼▼▼
████████████████████████████████████████████████████████████████████████████-->
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --ptt-orange: #f97316;
      --ptt-glow: rgba(249, 115, 22, 0.45);
      --record-red: #ef4444;

      --tag-11: #38bdf8;
      --tag-8: #a855f7;
      --tag-2: #ec4899;
      --tag-9: #10b981;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px 80px 16px;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-font-smoothing: antialiased;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }

    .view-tabs {
      display: flex;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .view-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-tab.active {
      background: var(--card-bg);
      color: var(--primary);
    }

    /* THE HERO FOYER HOPPER */
    .hopper-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      margin-top: 4px;
    }

    .hopper-bar { 
      display: flex; 
      gap: 10px; 
      align-items: stretch; 
    }
    .hopper-input-wrap { 
      flex: 1; 
      min-width: 0; 
    }
    .hopper-input-wrap textarea {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 16px;
      color: var(--text);
      font-size: 1.02rem;
      font-family: inherit;
      line-height: 1.45;
      resize: none;
      min-height: 72px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
      transition: all 0.18s ease;
    }
    .hopper-input-wrap textarea:focus { 
      outline: none; 
      border-color: var(--primary); 
      box-shadow: 0 0 0 1px var(--primary), inset 0 2px 6px rgba(0,0,0,0.4); 
    }

    .btn-hopper-submit {
      background: #111c2e;
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-hopper-submit:hover { background: #0c4a6e; border-color: var(--primary); color: #fff; }
    .btn-hopper-submit.ptt-active {
      background: var(--ptt-orange) !important;
      border-color: var(--ptt-orange) !important;
      color: #fff !important;
      box-shadow: 0 0 16px var(--ptt-glow);
    }

    .hopper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 6px 4px 2px 4px;
    }
    .hopper-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hopper-count-badge {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .hopper-chevron { color: var(--text-muted); font-size: 0.75rem; }
    .hopper-tray.collapsed { display: none; }
    .hopper-items { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }

    .hopper-card {
      background: #090e17;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hopper-card.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }

    .hopper-check {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #111c2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hopper-check:checked { background: var(--primary); border-color: var(--primary); }
    .hopper-check:checked::after { content: '✓'; color: #090e17; font-size: 0.8rem; font-weight: 900; }
    .hopper-text { font-size: 0.88rem; color: var(--text-sub); flex: 1; cursor: pointer; }
    .hopper-actions { display: flex; gap: 4px; align-items: center; }
    .hopper-delete-btn { background: transparent; color: var(--text-muted); border: none; padding: 4px 6px; font-size: 0.8rem; cursor: pointer; }
    .hopper-delete-btn:hover { color: var(--record-red); }

    .hopper-batch-bar {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .btn-stage-hopper {
      flex: 1;
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-clear-selection { background: transparent; border: none; color: var(--text-muted); font-size: 0.78rem; cursor: pointer; }
    .hopper-empty { padding: 12px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

    /* WORKBENCH PANEL */
    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s ease-out;
    }
    .input-panel.drawer-hidden {
      display: none !important;
    }

    .workbench-header { display: flex; justify-content: space-between; align-items: center; }
    .workbench-label { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
    .workbench-counter { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; }

    .staged-chips-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .staged-chip {
      background: #090e17;
      border: 1px solid #0284c7;
      color: #e0f2fe;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .staged-chip-remove { background: transparent; border: none; color: #7dd3fc; cursor: pointer; font-size: 0.85rem; }

    textarea {
      width: 100%;
      min-height: 70px;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }
    textarea:focus { outline: 1px solid var(--primary); }

    .workbench-actions { display: flex; gap: 8px; align-items: center; }
    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-workbench-reset {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0 12px;
      height: 44px;
      cursor: pointer;
    }

    /* BUNDLED BLOCKS LIST */
    .blocks-container { display: flex; flex-direction: column; gap: 12px; }

    .block-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 4px solid var(--primary);
      position: relative;
    }
    .block-card[data-color="11"] { border-left-color: var(--tag-11); }
    .block-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .block-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .block-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .block-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .block-title-row { display: flex; flex-direction: column; gap: 2px; }
    .block-title { font-size: 0.98rem; font-weight: 700; }
    .block-badge-domain {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .block-time { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    .block-atoms-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #090e17;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border);
    }

    .atom-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
      color: #e2e8f0;
      padding: 6px 8px;
      border-radius: 4px;
      background: #111c2e;
    }
    .atom-item.done { text-decoration: line-through; opacity: 0.45; }
    .atom-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .atom-check {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #090e17;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .atom-check:checked { background: var(--primary); border-color: var(--primary); }
    .atom-check:checked::after { content: '✓'; color: #090e17; font-size: 0.7rem; font-weight: 900; }

    .atom-controls { display: flex; gap: 6px; align-items: center; }
    .btn-atom-split {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .btn-atom-split:hover { color: var(--primary); border-color: var(--primary); }

    .btn-item-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }
    .btn-item-delete:hover { color: var(--record-red); }

    .btn-save {
      background: #0284c7;
      color: white;
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover { background: #0369a1; }

    .track-active-banner {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.15);
    }

    /* FLOATING BOTTOM DOCK */
    .floating-control-dock {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      z-index: 999;
      pointer-events: none;
    }
    .floating-control-dock > * { pointer-events: auto; }

    .floating-ab-bar {
      display: inline-flex;
      align-items: center;
      background: #090e17;
      border: 1px solid var(--primary);
      border-radius: 9999px;
      padding: 3px 6px;
      gap: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .floating-ab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .floating-ab-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .floating-ab-btn.btn-copy {
      color: var(--text-muted);
      border-left: 1px solid var(--border);
      border-radius: 0;
      padding-left: 8px;
    }

    .forge-pill {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* FORGE DRAWER */
    .forge-drawer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      max-width: 580px;
      background: #090e17;
      border-top: 2px solid var(--primary);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
      z-index: 1000;
      height: 70vh;
      height: 70dvh;
      display: flex;
      flex-direction: column;
      border-radius: 14px 14px 0 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      overflow: hidden;
    }

    .forge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
      border-radius: 14px 14px 0 0;
      width: 100%;
      flex-shrink: 0;
    }
    .forge-title { font-size: 0.82rem; font-weight: 700; color: var(--primary); }
    .forge-header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0 4px; }

    .forge-chat-log {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.45;
      font-size: 0.84rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 14px 14px 2px 14px;
      border: 1px solid var(--border);
      max-width: 84%;
      width: fit-content;
    }
    .chat-msg.model {
      align-self: flex-start;
      background: #131c2e;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 2px;
      border: 1px solid #1e293b;
      max-width: 88%;
      width: fit-content;
    }

    .forge-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px;
      border-top: 1px solid var(--border);
      background: #0f172a;
      flex-shrink: 0;
    }
    .forge-input-bar textarea {
      flex: 1 1 auto;
      width: 50%;
      min-width: 0;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 12px;
      font-size: 16px;
    }
    .forge-input-bar button {
      flex: 0 0 68px;
      width: 68px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 0;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .hidden { display: none !important; }
  </style>

<body>




  
<!--███████████████████████████████████████████████████████████████████████████
    ▼▼▼ ANCHOR: DOM_STRUCTURE_START ▼▼▼
████████████████████████████████████████████████████████████████████████████-->
  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <div class="view-tabs">
        <button type="button" class="view-tab active" id="tabPlan" onclick="switchView('plan')">Planning</button>
        <button type="button" class="view-tab" id="tabTrack" onclick="switchView('track')">Tracking</button>
      </div>
    </header>

    <!-- VIEW 1: PLANNING & BUNDLING -->
    <div id="viewPlan">
      <!-- DATE TOGGLE (TODAY / TOMORROW) -->
      <div class="date-strip-wrapper" style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
        <div id="dateStripPills" style="display: flex; gap: 8px; flex: 1;">
          <button type="button" class="view-tab active" id="btnDateToday" style="flex: 1; padding: 8px 12px;" onclick="selectSpecificDate(getLocalDateString(0))">Today</button>
          <button type="button" class="view-tab" id="btnDateTomorrow" style="flex: 1; padding: 8px 12px;" onclick="selectSpecificDate(getLocalDateString(1))">Tomorrow</button>
        </div>
      </div>

      <!-- PERSISTENT DAY-PLANNING WORKBENCH -->
      <section class="input-panel" id="workbenchPanel" style="margin-bottom: 14px;">
        <div class="workbench-header" style="margin-bottom: 8px;">
          <span class="workbench-label" id="workbenchLabel">Daily Intent &amp; Schedule Context</span>
          <span class="workbench-counter" id="workbenchCount">0 items staged</span>
        </div>

        <!-- STAGED HOPPER CHIPS (ONLY SHOWN IF ITEMS ARE PULLED FROM HOPPER) -->
        <div id="stagedChips" class="staged-chips-container hidden" style="margin-bottom: 8px;"></div>

        <textarea 
          id="promptInput" 
          placeholder="Plan your day naturally (e.g. 'Meeting at 10 and 11. Need to hit the gym, pick up orders, and grade portfolios')..."
          style="min-height: 84px; line-height: 1.45;"
        ></textarea>

        <div class="workbench-actions" style="margin-top: 8px;">
          <button id="submitBtn" class="btn-main" type="button" onclick="parseTasks()">⚡ Sequence Day</button>
          <button type="button" class="btn-workbench-reset" title="Clear Intent &amp; Staging" onclick="resetWorkbench()">✕</button>
        </div>
      </section>

      <!-- THE QUICK-CAPTURE HOPPER -->
      <section class="hopper-section" style="margin-bottom: 14px;">
        <div class="hopper-bar">
          <div class="hopper-input-wrap">
            <textarea 
              id="hopperInput" 
              placeholder="What do you need to do?" 
              rows="1"
              autocomplete="off"
            ></textarea>
          </div>
          <button type="button" id="hopperAddBtn" class="btn-hopper-submit" onclick="parseHopperInput()">Capture</button>
        </div>

        <div class="hopper-header" id="toggleHopperTray" onclick="toggleHopperDrawer()">
          <span class="hopper-title">
            <span>The Hopper</span>
            <span class="hopper-count-badge" id="hopperCount">0</span>
          </span>
          <span class="hopper-chevron" id="hopperChevron">▼</span>
        </div>

        <div class="hopper-tray collapsed" id="hopperTray">
          <div id="hopperList" class="hopper-items"></div>
        </div>
      </section>

      <!-- COLLAPSIBLE SCHEDULE REVIEW DRAWER -->
      <section class="hopper-section">
        <div class="hopper-header" id="toggleScheduleReview" onclick="toggleScheduleDrawer()" style="padding: 2px;">
          <span class="hopper-title">
            <span>Scheduled Blocks Preview</span>
            <span class="hopper-count-badge" id="planBlockCountBadge">0</span>
          </span>
          <span class="hopper-chevron" id="scheduleChevron">▶</span>

        <div id="scheduleReviewTray" class="collapsed" style="display: none; flex-direction: column; gap: 12px; padding-top: 10px;">
          <div id="planAiRationale"></div>
          <div id="blocksContainer" class="blocks-container"></div>
          <button id="saveBtn" class="btn-save hidden" onclick="saveToCalendar()" style="width: 100%;">
            Write Schedule to Calendar &amp; Start Tracking

    <!-- VIEW 2: EXECUTION / TRACK MODE -->
    <div id="viewTrack" class="hidden">
      <!-- PROGRESS METER -->
      <div class="track-progress-card" style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary);">Today's Trajectory</span>

        <div style="width: 100%; height: 6px; background: #090e17; border-radius: 999px; overflow: hidden;">
          <div id="trackProgressBar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease;"></div>

      <!-- ACTIVE NOW FOCUSED HERO BANNER -->
      <div id="trackActiveBanner" class="track-active-banner hidden" style="margin-bottom: 14px;"></div>

      <!-- TIMELINE BLOCKS -->
      <div id="trackBlocksContainer" class="blocks-container"></div>

  <!-- FLOATING BOTTOM DOCK -->
  <div class="floating-control-dock">
    <div id="floatingAbBar" class="floating-ab-bar hidden">
      <button type="button" class="floating-ab-btn active" id="btnDockOrig" onclick="applyVariantFromDock('orig')">Orig</button>
      <button type="button" class="floating-ab-btn" id="btnDockA" onclick="applyVariantFromDock('a')">A</button>
      <button type="button" class="floating-ab-btn" id="btnDockB" onclick="applyVariantFromDock('b')">B</button>

      <textarea 
        id="forgeInput" 
        placeholder="Chat with Gemini (Shift+Enter for newline)..." 
        rows="1"
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="sentences" 
        spellcheck="false" 
        style="resize: none; overflow-y: hidden; min-height: 40px; padding: 10px 12px; line-height: 1.3;"

<!--███████████████████████████████████████████████████████████████████████████
    ▲▲▲ ANCHOR: DOM_STRUCTURE_END ▲▲▲
████████████████████████████████████████████████████████████████████████████-->



  
  <script>
    const WORKER_URL = 'https://personal-scheduler-proxy.strand-troy.workers.dev';
    const APP_KEY = 'sequencer-lock-52984'; // Replace with your actual Cloudflare CLIENT_ACCESS_KEY
    let currentEvents = [];




    
/*███████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: TASK_CARD_RENDER_START ▼▼▼
█████████████████████████████████████████████████████████████████████████████*/
    function getLocalDateString(offsetDays = 0, baseDate = new Date()) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let activePlanDate = getLocalDateString(0);
    let currentBlocks = JSON.parse(localStorage.getItem('current_blocks') || '[]');
    let currentView = localStorage.getItem('current_view') || 'plan';
    let hopperItems = JSON.parse(localStorage.getItem('hopper_items') || '[]');
    let selectedHopperIds = new Set();
    let stagedWorkbenchTasks = JSON.parse(localStorage.getItem('staged_workbench_tasks') || '[]');
    let lastStateTimestamp = parseInt(localStorage.getItem('last_state_timestamp') || '0', 10);
    let lastAiRationale = "";

    if (lastStateTimestamp > Date.now() + 60000) {
      lastStateTimestamp = 0;
      localStorage.setItem('last_state_timestamp', '0');
    }

    const todayStr = getLocalDateString(0);

    let stateDirty = false;
    currentBlocks = currentBlocks.map(blk => {
      if (!blk.date) {
        blk.date = todayStr;
        stateDirty = true;
      }
      const hasPendingAtoms = (blk.atoms || []).some(a => !a.done);
      if (blk.date < todayStr && hasPendingAtoms) {
        blk.date = todayStr;
        stateDirty = true;
      }
      return blk;
    });
    if (stateDirty) {
      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
    }

    let syncTimeout = null;
    window.triggerBackgroundSync = function() {
      const now = Date.now();
      lastStateTimestamp = now;
      localStorage.setItem('last_state_timestamp', now.toString());

      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(async () => {
        try {
          const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-App-Key': APP_KEY },
            body: JSON.stringify({
              action: 'PUSH_STATE',
              hopper: hopperItems,
              blocks: currentBlocks,
              staged: stagedWorkbenchTasks,
              timestamp: now
            })
          });
          if (res.ok) console.log('✓ Edge sync pushed');
        } catch (err) {
          console.warn('Background sync postponed:', err.message);
        }
      }, 300);
    };

    window.pullLatestState = async function() {
      try {
        const res = await fetch(`${WORKER_URL}?t=${Date.now()}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-App-Key': APP_KEY },
          body: JSON.stringify({ action: 'GET_STATE' })
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.updated_at && data.updated_at > lastStateTimestamp) {
          hopperItems = JSON.parse(data.hopper_json || '[]');
          currentBlocks = JSON.parse(data.blocks_json || '[]');
          stagedWorkbenchTasks = JSON.parse(data.staged_json || '[]');
          lastStateTimestamp = data.updated_at;

          localStorage.setItem('hopper_items', JSON.stringify(hopperItems));
          localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
          localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
          localStorage.setItem('last_state_timestamp', lastStateTimestamp.toString());

          renderHopper();
          renderWorkbench();
          renderBlocks();
          if (currentView === 'track') renderTrackView();
          console.log('✓ Edge state pulled & hydrated');
        }
      } catch (err) {
        console.warn('Pull state failed:', err.message);
      }
    };

    // Cross-Platform Wake Watchers
    window.addEventListener('focus', () => window.pullLatestState());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') window.pullLatestState();
    });
    window.addEventListener('pageshow', () => window.pullLatestState());

    let lastActivityPull = 0;
    function pulseOnActivity() {
      const now = Date.now();
      if (now - lastActivityPull > 4000) {
        lastActivityPull = now;
        window.pullLatestState();
      }
    }
    document.addEventListener('touchstart', pulseOnActivity, { passive: true });
    document.addEventListener('mousemove', pulseOnActivity, { passive: true });
    document.addEventListener('keydown', pulseOnActivity, { passive: true });

    setInterval(() => {
      if (document.visibilityState === 'visible') window.pullLatestState();
    }, 15000);

    // Global Drawer Toggles
    window.toggleHopperDrawer = function() {
      const tray = document.getElementById('hopperTray');
      const chevron = document.getElementById('hopperChevron');
      if (!tray) return;
      const isCollapsed = tray.classList.toggle('collapsed');
      if (chevron) chevron.textContent = isCollapsed ? '▼' : '▲';
    };

    window.toggleScheduleDrawer = function() {
      const tray = document.getElementById('scheduleReviewTray');
      const chevron = document.getElementById('scheduleChevron');
      if (!tray) return;
      const isHidden = tray.style.display === 'none';
      tray.style.display = isHidden ? 'flex' : 'none';
      if (chevron) chevron.textContent = isHidden ? '▼' : '▶';
    };

    function renderDateStrip() {
      const btnToday = document.getElementById('btnDateToday');
      const btnTmrw = document.getElementById('btnDateTomorrow');
      const tmrwStr = getLocalDateString(1);
      if (btnToday) btnToday.classList.toggle('active', activePlanDate === todayStr);
      if (btnTmrw) btnTmrw.classList.toggle('active', activePlanDate === tmrwStr);
    }

    window.selectSpecificDate = function(dateStr) {
      if (!dateStr) return;
      activePlanDate = dateStr;
      renderDateStrip();
      renderBlocks();
    };

    window.switchView = function(viewName) {
      currentView = viewName;
      localStorage.setItem('current_view', viewName);

      const tabPlan = document.getElementById('tabPlan');
      const tabTrack = document.getElementById('tabTrack');
      const viewPlan = document.getElementById('viewPlan');
      const viewTrack = document.getElementById('viewTrack');

      if (tabPlan) tabPlan.classList.toggle('active', viewName === 'plan');
      if (tabTrack) tabTrack.classList.toggle('active', viewName === 'track');
      if (viewPlan) viewPlan.classList.toggle('hidden', viewName !== 'plan');
      if (viewTrack) viewTrack.classList.toggle('hidden', viewName !== 'track');

      if (viewName === 'track') {
        renderTrackView();
      } else {
        renderDateStrip();
        renderBlocks();
      }
    };

    function saveHopper() {
      localStorage.setItem('hopper_items', JSON.stringify(hopperItems));
      window.triggerBackgroundSync();
      renderHopper();
    }

    function renderHopper() {
      const listEl = document.getElementById('hopperList');
      const countEl = document.getElementById('hopperCount');
      if (!listEl || !countEl) return;

      const stagedIdSet = new Set(stagedWorkbenchTasks.map(t => t.id));
      const stagedCount = hopperItems.filter(h => stagedIdSet.has(h.id)).length;
      const unStagedCount = hopperItems.length - stagedCount;

      countEl.innerHTML = stagedCount > 0 
        ? `${unStagedCount} <span style="font-size:0.75rem;opacity:0.8;font-weight:400;">(${stagedCount} staging)</span>`
        : `${hopperItems.length}`;

      if (hopperItems.length === 0) {
        listEl.innerHTML = '<div class="hopper-empty">Hopper is clear. Mind is free.</div>';
        selectedHopperIds.clear();
        return;
      }

      const itemsMarkup = hopperItems.map((item) => {
        const isStaged = stagedIdSet.has(item.id);
        const isChecked = selectedHopperIds.has(item.id);

        return `
          <div class="hopper-card ${isChecked ? 'selected' : ''} ${isStaged ? 'staged-in-plan' : ''}" id="card_${item.id}">
            <input 
              type="checkbox" 
              class="hopper-check" 
              ${isChecked ? 'checked' : ''} 
              ${isStaged ? 'disabled' : ''}
              onchange="toggleHopperSelection('${item.id}', this.checked)"
            />
            <span class="hopper-text" onclick="${isStaged ? '' : `toggleHopperCheckbox('${item.id}')`}">
              ${escapeHtml(item.rawText)}
            </span>
            ${isStaged ? '<span class="badge-staging">⚡ In Staging</span>' : ''}
            <div class="hopper-actions">
              <button class="hopper-delete-btn" onclick="deleteHopperItem('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');

      const count = selectedHopperIds.size;
      const batchBar = count > 0 ? `
        <div class="hopper-batch-bar">
          <button class="btn-stage-hopper" onclick="stageSelectedHopperItems()">
            Pull ${count} into Plan ➔
          </button>
          <button class="btn-clear-selection" onclick="clearHopperSelection()">Deselect</button>
        </div>
      ` : '';

      listEl.innerHTML = itemsMarkup + batchBar;
    }

    window.toggleHopperSelection = function(id, isSelected) {
      if (isSelected) selectedHopperIds.add(id);
      else selectedHopperIds.delete(id);
      renderHopper();
    };

    window.toggleHopperCheckbox = function(id) {
      window.toggleHopperSelection(id, !selectedHopperIds.has(id));
    };

    window.clearHopperSelection = function() {
      selectedHopperIds.clear();
      renderHopper();
    };

    window.stageSelectedHopperItems = function() {
      if (selectedHopperIds.size === 0) return;
      const itemsToStage = hopperItems.filter(item => selectedHopperIds.has(item.id));
      itemsToStage.forEach(item => {
        if (!stagedWorkbenchTasks.some(t => t.id === item.id)) {
          stagedWorkbenchTasks.push({ id: item.id, text: item.rawText });
        }
      });

      localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
      window.triggerBackgroundSync();
      selectedHopperIds.clear();
      renderHopper();
      renderWorkbench();
    };

    function renderWorkbench() {
      const container = document.getElementById('stagedChips');
      const countLabel = document.getElementById('workbenchCount');
      const submitBtn = document.getElementById('submitBtn');
      if (!container || !countLabel || !submitBtn) return;

      const count = stagedWorkbenchTasks.length;
      countLabel.textContent = `${count} staged item${count === 1 ? '' : 's'}`;

      if (count === 0) {
        container.classList.add('hidden');
        container.innerHTML = '';
        submitBtn.innerText = '⚡ Sequence Day';
      } else {
        container.classList.remove('hidden');
        container.innerHTML = stagedWorkbenchTasks.map((t, idx) => `
          <div class="staged-chip">
            <span class="staged-chip-text" title="${escapeHtml(t.text)}">${escapeHtml(t.text)}</span>
            <button type="button" class="staged-chip-remove" onclick="removeStagedTask(${idx})">✕</button>
          </div>
        `).join('');
        submitBtn.innerText = `⚡ Sequence Day (${count} Staged)`;
      }
    }

    window.removeStagedTask = function(index) {
      stagedWorkbenchTasks.splice(index, 1);
      localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
      window.triggerBackgroundSync();
      renderHopper();
      renderWorkbench();
    };

    window.resetWorkbench = function() {
      stagedWorkbenchTasks = [];
      localStorage.removeItem('staged_workbench_tasks');
      const promptInput = document.getElementById('promptInput');
      if (promptInput) promptInput.value = '';
      window.triggerBackgroundSync();
      renderHopper();
      renderWorkbench();
    };

    window.deleteHopperItem = function(id) {
      hopperItems = hopperItems.filter(item => item.id !== id);
      selectedHopperIds.delete(id);
      stagedWorkbenchTasks = stagedWorkbenchTasks.filter(item => item.id !== id);
      localStorage.setItem('staged_workbench_tasks', JSON.stringify(stagedWorkbenchTasks));
      saveHopper();
      renderWorkbench();
    };

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      const m = parts[1] || '00';
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${m}${ampm}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Planning Preview strictly excludes blocks already written to Calendar or fully finished
    function renderBlocks() {
      const container = document.getElementById('blocksContainer');
      const saveBtn = document.getElementById('saveBtn');
      const badge = document.getElementById('planBlockCountBadge');
      if (!container) return;

      const visibleBlocks = currentBlocks.filter(b => {
        const matchesDate = (b.date || todayStr) === activePlanDate;
        const allDone = (b.atoms || []).length > 0 && b.atoms.every(a => a.done);
        return matchesDate && !b.calendar_synced && !allDone;
      });

      if (badge) badge.textContent = visibleBlocks.length;

      const rationaleBox = document.getElementById('planAiRationale');
      if (rationaleBox) {
        if (lastAiRationale) {
          rationaleBox.innerHTML = `
            <div style="background:#131c2e; border:1px solid #0284c7; border-radius:8px; padding:12px; margin-bottom:12px;">
              <div style="font-size:0.86rem; color:#e0f2fe; margin-bottom:8px;">${escapeHtml(lastAiRationale)}</div>
              <div style="display:flex; gap:8px;">
                <button type="button" class="btn-main" style="padding:6px 12px; font-size:0.8rem;" onclick="dismissAiRationale(true)">Looks Good</button>
                <button type="button" class="btn-workbench-reset" style="height:auto; padding:6px 12px; font-size:0.8rem;" onclick="dismissAiRationale(false)">Adjust Plan</button>
              </div>
            </div>
          `;
        } else {
          rationaleBox.innerHTML = '';
        }
      }

      if (!visibleBlocks.length) {
        container.innerHTML = `<div class="hopper-empty">Planning tray is clear. All scheduled blocks have been written to Calendar.</div>`;
        if (saveBtn) saveBtn.classList.add('hidden');
        return;
      }

      container.innerHTML = visibleBlocks.map((blk) => {
        const timeDisplay = `${formatTime12(blk.start_time)} – ${formatTime12(blk.end_time)}`;
        const atoms = blk.atoms || [];

        return `
          <div class="block-card" data-color="${blk.color_id || '9'}">
            <div class="block-header">
              <div class="block-title-row">
                <span class="block-badge-domain">${escapeHtml(blk.domain || 'Batch')}</span>
                <div class="block-title">${escapeHtml(blk.title)}</div>
              </div>
              <div style="display: flex; gap: 6px; align-items: center;">
                <span class="block-time">${timeDisplay}</span>
                <button type="button" class="btn-item-delete" title="Discard block" onclick="deleteBlock('${blk.id}')">✕</button>
              </div>
            </div>

            <div class="block-atoms-list">
              ${atoms.map((atom, atomIdx) => `
                <div class="atom-item ${atom.done ? 'done' : ''}">
                  <div class="atom-left">
                    <span>${escapeHtml(atom.text)}</span>
                  </div>
                  <div class="atom-controls">
                    <span style="font-size:0.7rem;color:var(--text-muted);">${atom.est_minutes || 15}m</span>
                    <button class="btn-item-delete" title="Delete task" onclick="deleteAtomFromBlock('${blk.id}',${atomIdx})">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      if (saveBtn) saveBtn.classList.remove('hidden');
    }

    // Write to Calendar: Tags blocks as calendar_synced so they clear out of Planning
    window.saveToCalendar = async function() {
      const saveBtn = document.getElementById('saveBtn');
      const unsyncedBlocks = currentBlocks.filter(b => (b.date || todayStr) === activePlanDate && !b.calendar_synced);

      if (!unsyncedBlocks.length) {
        alert('All blocks for this date have already been written to Google Calendar.');
        return;
      }

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerText = 'Writing to Calendar...';
      }

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({
            action: 'INSERT',
            blocks: unsyncedBlocks
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        // Flag synced blocks so they disappear from Planning view
        unsyncedBlocks.forEach(b => { b.calendar_synced = true; });
        localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
        window.triggerBackgroundSync();

        // Switch automatically into Tracking
        switchView('track');
      } catch (err) {
        alert('Calendar sync error: ' + err.message);
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerText = 'Write Schedule to Calendar & Start Tracking';
        }
      }
    };

    window.dismissAiRationale = function(accepted) {
      if (!accepted) {
        const promptInput = document.getElementById('promptInput');
        if (promptInput) {
          promptInput.value = `I'd like to adjust this plan: `;
          promptInput.focus();
        }
      }
      lastAiRationale = "";
      renderBlocks();
    };

    window.deleteBlock = function(blkId) {
      if (!confirm('Discard this block and its tasks?')) return;
      currentBlocks = currentBlocks.filter(b => b.id !== blkId);
      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      window.triggerBackgroundSync();
      renderBlocks();
      if (currentView === 'track') renderTrackView();
    };

    window.deleteAtomFromBlock = function(blkId, atomIdx) {
      const blk = currentBlocks.find(b => b.id === blkId);
      if (!blk || !blk.atoms) return;
      blk.atoms.splice(atomIdx, 1);
      if (blk.atoms.length === 0) {
        currentBlocks = currentBlocks.filter(b => b.id !== blkId);
      }
      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      window.triggerBackgroundSync();
      renderBlocks();
      if (currentView === 'track') renderTrackView();
    };

    function renderTrackView() {
      const container = document.getElementById('trackBlocksContainer');
      const banner = document.getElementById('trackActiveBanner');
      const progressText = document.getElementById('trackProgressText');
      const progressBar = document.getElementById('trackProgressBar');
      if (!container) return;

      const todayBlocks = currentBlocks.filter(b => (b.date || todayStr) === todayStr);

      if (!todayBlocks.length) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;">No blocks scheduled for today. Head to Planning to sequence your tasks.</div>';
        if (banner) banner.classList.add('hidden');
        if (progressText) progressText.textContent = '0% Completed';
        if (progressBar) progressBar.style.width = '0%';
        return;
      }

      let totalAtoms = 0;
      let doneAtoms = 0;
      todayBlocks.forEach(b => {
        (b.atoms || []).forEach(a => {
          totalAtoms++;
          if (a.done) doneAtoms++;
        });
      });
      const pct = totalAtoms > 0 ? Math.round((doneAtoms / totalAtoms) * 100) : 0;

      if (progressText) {
        progressText.textContent = `${doneAtoms} / ${totalAtoms} Done (${pct}%)`;
      }
      if (progressBar) progressBar.style.width = `${pct}%`;

      container.innerHTML = todayBlocks.map((blk) => {
        const timeDisplay = `${formatTime12(blk.start_time)} – ${formatTime12(blk.end_time)}`;
        const atoms = blk.atoms || [];
        const isBlockDone = atoms.length > 0 && atoms.every(a => a.done);

        return `
          <div class="block-card ${isBlockDone ? 'block-completed' : ''}" data-color="${blk.color_id || '9'}">
            <div class="block-header">
              <div class="block-title-row">
                <span class="block-badge-domain">${escapeHtml(blk.domain)}</span>
                <div class="block-title" style="${isBlockDone ? 'text-decoration: line-through;' : ''}">${escapeHtml(blk.title)}</div>
              </div>
              <span class="block-time">${timeDisplay}</span>
            </div>

          blk.start_time = startStr;
          blk.end_time = endStr;

          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      renderBlocks();

          mediaRecorder.onstop = async () => {
            if (currentStream) {
              currentStream.getTracks().forEach(t => t.stop());
              currentStream = null;
            }
            buttonEl.classList.remove('ptt-active');
            buttonEl.innerText = originalText;

            if (audioChunks.length === 0) return;

            const finalMime = mediaRecorder.mimeType || mimeType || 'audio/mp4';
            const audioBlob = new Blob(audioChunks, { type: finalMime });

            try {
              const base64Data = await blobToBase64(audioBlob);
              onAudioCaptured({ data: base64Data, mimeType: finalMime });
            } catch (encodeErr) {
              alert('Failed to process audio: ' + encodeErr.message);
            }
          };

          mediaRecorder.start(250);
        } else {
          isRecordingPTT = false;
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try { mediaRecorder.requestData(); } catch (err) {}
            mediaRecorder.stop();
          }
        }
      });
    }
    
    // Attach PTT to Hopper Capture
    attachHardwarePTT(
      hopperAddBtn,
      (audioPayload) => parseHopperInput(audioPayload),
      () => parseHopperInput()
    );

    // Sequence tap
    if (submitBtn) {
      submitBtn.onclick = () => parseTasks();
    }

    // Auto-resize helper
    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      if (el.scrollHeight > 120) {
        el.style.overflowY = 'auto';
      } else {
        el.style.overflowY = 'hidden';
      }
    }

    // Hopper Shift+Enter listener
    if (hopperInput) {
      hopperInput.addEventListener('input', () => autoResizeTextarea(hopperInput));
      hopperInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (e.shiftKey) {
            setTimeout(() => autoResizeTextarea(hopperInput), 0);
          } else {
            e.preventDefault();
            parseHopperInput();
            hopperInput.style.height = '52px';
          }
        }
      });
    }

    // Forge Drawer Shift+Enter listener
    const forgeInput = document.getElementById('forgeInput');
    if (forgeInput) {
      forgeInput.addEventListener('input', () => autoResizeTextarea(forgeInput));
      forgeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (e.shiftKey) {
            setTimeout(() => autoResizeTextarea(forgeInput), 0);
          } else {
            e.preventDefault();
            sendForgeMessage();
            forgeInput.style.height = '40px';
          }
        }
      });
    }

    // Hopper Tray Toggle
    const toggleHopperBtn = document.getElementById('toggleHopperTray');
    if (toggleHopperBtn) {
      toggleHopperBtn.addEventListener('click', () => {
        const tray = document.getElementById('hopperTray');
        const chevron = document.getElementById('hopperChevron');
        if (tray) {
          const isCollapsed = tray.classList.toggle('collapsed');
          if (chevron) chevron.textContent = isCollapsed ? '▼' : '▲';
        }
      });
    }

    // BOOT SEQUENCE: Explicitly enforces progressive disclosure on fresh load
    renderHopper();
    renderWorkbench();
    switchView(currentView);
