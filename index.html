<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Task Sequencer</title>

  <!-- iOS Standalone Full-Screen App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sequencer">
  <meta name="theme-color" content="#0d0708">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ==========================================================================
       >>> ANCHOR: CSS_THEME_AND_LAYOUT_START <<<
       ========================================================================== -->
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --record-red: #ef4444;
      --record-glow: rgba(239, 68, 68, 0.4);

      --tag-11: #38bdf8;
      --tag-8: #a855f7;
      --tag-2: #ec4899;
      --tag-9: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)) 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .badge {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 8px;
      border-radius: 9999px;
    }

    /* THE MINIMAL HOPPER */
    .hopper-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hopper-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hopper-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .hopper-input-wrap input {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }
    .hopper-input-wrap input:focus { outline: 1px solid var(--primary); border-color: var(--primary); }

    /* Dedicated Voice Dictation Button */
    .btn-hopper-voice {
      background: #111c2e;
      border: 1px solid var(--border);
      color: var(--text-sub);
      width: 44px;
      height: 42px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-hopper-voice svg { width: 18px; height: 18px; fill: currentColor; }
    .btn-hopper-voice:hover { color: var(--text); border-color: var(--primary); background: #0c4a6e; }

    .btn-hopper-voice.recording {
      color: #fff;
      background: var(--record-red);
      border-color: var(--record-red);
      box-shadow: 0 0 12px var(--record-glow);
      animation: recordPulse 1.4s infinite ease-in-out;
    }

    @keyframes recordPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 var(--record-glow); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 var(--record-glow); }
    }

    .btn-hopper-submit {
      background: #111c2e;
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      height: 42px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-hopper-submit:hover { background: #0c4a6e; border-color: var(--primary); color: #fff; }
    .btn-hopper-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .hopper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 2px 2px;
    }

    .hopper-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hopper-count-badge {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 9999px;
    }

    .hopper-chevron {
      color: var(--text-muted);
      font-size: 0.7rem;
      transition: transform 0.2s ease;
    }

    .hopper-tray.collapsed { display: none; }

    .hopper-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 4px;
    }

    .hopper-card {
      background: #090e17;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .hopper-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      flex: 1;
      word-break: break-word;
    }

    .hopper-actions { display: flex; gap: 4px; }

    .hopper-promote-btn {
      background: #0c4a6e;
      border: 1px solid #0284c7;
      color: #bae6fd;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }
    .hopper-promote-btn:hover { background: #0369a1; }

    .hopper-delete-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 4px 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .hopper-delete-btn:hover { color: var(--record-red); }

    .hopper-empty {
      padding: 8px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Primary Sequencer Area */
    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    textarea {
      width: 100%;
      min-height: 80px;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 1px solid var(--primary); border-color: var(--primary); }

    .button-row { display: flex; gap: 8px; }
    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
      transition: background 0.15s ease;
    }
    button.btn-main:hover { background: var(--primary-hover); color: #fff; }
    button.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    button.btn-mic {
      background: #111c2e;
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button.btn-mic.listening {
      border-color: var(--record-red);
      color: #fff;
      background: var(--record-red);
      animation: recordPulse 1.4s infinite ease-in-out;
    }
    button.btn-mic svg { width: 18px; height: 18px; fill: currentColor; }

    /* Task Sorting List */
    .task-list { display: flex; flex-direction: column; gap: 10px; }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 4px solid var(--primary);
    }

    .task-card[data-color="11"] { border-left-color: var(--tag-11); }
    .task-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .task-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .task-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .task-title { font-size: 0.95rem; font-weight: 600; line-height: 1.35; }
    .sort-controls { display: flex; gap: 4px; }
    .btn-arrow {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-arrow:hover { color: var(--text); border-color: var(--primary); }

    .task-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-split {
      background: #0c4a6e;
      border: 1px solid #0284c7;
      color: #bae6fd;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .step-checklist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .step-item {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-save {
      background: #0284c7;
      color: white;
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover { background: #0369a1; }
    .btn-save:disabled { opacity: 0.5; }

    /* Forge */
    .forge-pill {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: 16px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      z-index: 999;
    }
    .forge-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #090e17;
      border-top: 2px solid var(--primary);
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
      z-index: 1000;
      height: 80vh;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 14px 14px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .forge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
      border-radius: 14px 14px 0 0;
    }
    .forge-title { font-size: 0.82rem; font-weight: 700; color: var(--primary); }
    .forge-header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }

    .forge-chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
      line-height: 1.45;
      font-size: 0.85rem;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px 12px 2px 12px;
      border: 1px solid var(--border);
    }
    .chat-msg.model {
      align-self: flex-start;
      background: #131c2e;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px 12px 12px 2px;
      border: 1px solid #1e293b;
    }
    .patch-btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-live-patch {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .forge-input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: #0f172a;
      display: flex;
      gap: 8px;
    }
    .forge-input-bar input {
      flex: 1;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.88rem;
    }
    .forge-input-bar button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .typing-dots { display: inline-flex; gap: 4px; padding: 4px 8px; }
    .typing-dots span { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    .hidden { display: none !important; }
  </style>
  <!-- ==========================================================================
       >>> ANCHOR: CSS_THEME_AND_LAYOUT_END <<<
       ========================================================================== -->

<body>

<!-- ==========================================================================
       >>> ANCHOR: DOM_STRUCTURE_START <<<
       ========================================================================== -->
  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <span class="badge">Standalone</span>
    </header>

    <!-- THE MINIMAL HOPPER -->
    <section class="hopper-section">
      <div class="hopper-bar">
        <div class="hopper-input-wrap">
          <input 
            type="text" 
            id="hopperInput" 
            placeholder="Quick capture or voice dump..." 
            autocomplete="off" 
          />
        </div>
        <button type="button" id="hopperVoiceBtn" class="btn-hopper-voice" title="Dictate to Hopper">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <button type="button" id="hopperAddBtn" class="btn-hopper-submit" onclick="parseHopperInput()">Capture</button>
      </div>

      <div class="hopper-header" id="toggleHopperTray">
        <span class="hopper-title">
          <span>The Hopper</span>
          <span class="hopper-count-badge" id="hopperCount">0</span>
        </span>
        <span class="hopper-chevron" id="hopperChevron">▼</span>
      </div>

      <div class="hopper-tray collapsed" id="hopperTray">
        <div id="hopperList" class="hopper-items">
          <!-- Dynamic Hopper Cards -->
        </div>
      </div>
    </section>

    <!-- MAIN SEQUENCER INPUT PANEL -->
    <div class="input-panel">
      <textarea id="promptInput" placeholder="Morning list: 'Grade 10 essays, mail package, 30m gym session, call Dalton at 2'"></textarea>
      <div class="button-row">
        <button id="micBtn" class="btn-mic" type="button" title="Voice Dictate Morning Plan">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <button id="submitBtn" class="btn-main">Parse & Sequence</button>
      </div>
    </div>

    <div id="taskList" class="task-list"></div>

    <button id="saveBtn" class="btn-save hidden" onclick="saveToCalendar()">Write Order to Calendar</button>
  </div>

  <!-- FLOATING FORGE BUTTON -->
  <button id="forgeToggle" class="forge-pill" onclick="toggleForge()">✦ Forge</button>

  <!-- GEMINI FORGE DRAWER -->
  <div id="forgeDrawer" class="forge-drawer hidden">
    <div class="forge-header">
      <div class="forge-title">✦ GEMINI COMPANION</div>
      <div class="forge-header-actions">
        <button class="btn-icon" onclick="clearForgeChat()">Clear History</button>
        <button class="btn-close" onclick="toggleForge()">✕</button>
      </div>
    </div>
    
    <div id="forgeChatLog" class="forge-chat-log"></div>

    <div class="forge-input-bar">
      <input id="forgeInput" placeholder="Chat with Gemini or request code tweaks..." autocomplete="off" />
      <button id="forgeSendBtn" onclick="sendForgeMessage()">Send</button>
    </div>
  </div>
  <!-- ==========================================================================
       >>> ANCHOR: DOM_STRUCTURE_END <<<
       ========================================================================== -->

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';
    let currentEvents = [];

    /* ==========================================================================
       >>> ANCHOR: TASK_CARD_RENDER_START <<<
       ========================================================================== */
    let hopperItems = JSON.parse(localStorage.getItem('hopper_items') || '[]');

    function saveHopper() {
      localStorage.setItem('hopper_items', JSON.stringify(hopperItems));
      renderHopper();
    }

    function renderHopper() {
      const listEl = document.getElementById('hopperList');
      const countEl = document.getElementById('hopperCount');
      if (!listEl || !countEl) return;

      countEl.textContent = hopperItems.length;

      if (hopperItems.length === 0) {
        listEl.innerHTML = '<div class="hopper-empty">Hopper is clear. Mind is free.</div>';
        return;
      }

      listEl.innerHTML = hopperItems.map((item, index) => `
        <div class="hopper-card">
          <span class="hopper-text">${item.rawText}</span>
          <div class="hopper-actions">
            <button class="hopper-promote-btn" onclick="promoteHopperItem(${index})">Sequence ➔</button>
            <button class="hopper-delete-btn" onclick="deleteHopperItem(${index})">✕</button>
          </div>
        </div>
      `).join('');
    }

    // LLM-Powered Hopper Parsing
    window.parseHopperInput = async function() {
      const input = document.getElementById('hopperInput');
      const btn = document.getElementById('hopperAddBtn');
      const text = input ? input.value.trim() : '';
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Extracting...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ action: 'HOPPER_PARSE', text })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const extracted = data.items || [];

        if (extracted.length > 0) {
          extracted.forEach(str => {
            hopperItems.unshift({
              id: 'hop_' + Date.now() + Math.random(),
              rawText: str,
              createdAt: new Date().toISOString()
            });
          });
        } else {
          hopperItems.unshift({
            id: 'hop_' + Date.now(),
            rawText: text,
            createdAt: new Date().toISOString()
          });
        }

        input.value = '';
        saveHopper();

        const tray = document.getElementById('hopperTray');
        const chevron = document.getElementById('hopperChevron');
        if (tray && tray.classList.contains('collapsed')) {
          tray.classList.remove('collapsed');
          if (chevron) chevron.textContent = '▲';
        }
      } catch (err) {
        console.error('Hopper LLM fallback triggered:', err);
        // Resilient fallback: save raw thought directly if Worker fails
        hopperItems.unshift({
          id: 'hop_' + Date.now(),
          rawText: text,
          createdAt: new Date().toISOString()
        });
        input.value = '';
        saveHopper();
      } finally {
        btn.disabled = false;
        btn.innerText = 'Capture';
      }
    };

    window.deleteHopperItem = function(index) {
      hopperItems.splice(index, 1);
      saveHopper();
    };

    window.promoteHopperItem = function(index) {
      const item = hopperItems[index];
      if (!item) return;

      let startH = 8, startM = 0;
      if (currentEvents.length > 0) {
        const lastEv = currentEvents[currentEvents.length - 1];
        if (lastEv.end_time) {
          const [h, m] = lastEv.end_time.split(':').map(Number);
          startH = h;
          startM = m + 5;
        }
      } else {
        const now = new Date();
        startH = now.getHours();
        startM = Math.ceil(now.getMinutes() / 5) * 5;
      }

      const dur = 15;
      const endTotalMin = startH * 60 + startM + dur;
      const endH = Math.floor(endTotalMin / 60) % 24;
      const endM = endTotalMin % 60;

      const newEvent = {
        title: item.rawText,
        start_time: `${String(startH).padStart(2, '0')}:${String(startM).padStart(2, '0')}`,
        end_time: `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`,
        duration_minutes: dur,
        color_id: '11',
        steps: []
      };

      currentEvents.push(newEvent);
      hopperItems.splice(index, 1);
      saveHopper();
      renderTaskList();
    };

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      const m = parts[1] || '00';
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${m}${ampm}`;
    }

    function renderTaskList() {
      const container = document.getElementById('taskList');
      const saveBtn = document.getElementById('saveBtn');

      if (!currentEvents.length) {
        container.innerHTML = '';
        saveBtn.classList.add('hidden');
        return;
      }

      container.innerHTML = currentEvents.map((ev, index) => {
        const timeDisplay = `${formatTime12(ev.start_time)} – ${formatTime12(ev.end_time)}`;
        const hasSteps = ev.steps && ev.steps.length > 0;

        return `
          <div class="task-card" data-color="${ev.color_id || '9'}">
            <div class="task-header">
              <div class="task-title">${ev.title}</div>
              <div class="sort-controls">
                <button class="btn-arrow" onclick="moveTask(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>▲</button>
                <button class="btn-arrow" onclick="moveTask(${index}, 1)" ${index === currentEvents.length - 1 ? 'disabled style="opacity:0.3"' : ''}>▼</button>
              </div>
            </div>
            <div class="task-meta">
              <span>${timeDisplay} (${ev.duration_minutes || 30}m)</span>
              ${hasSteps ? `<button class="btn-split" onclick="toggleSteps(${index})">Micro-Steps</button>` : ''}
            </div>
            ${hasSteps ? `
              <div id="steps_${index}" class="step-checklist hidden">
                ${ev.steps.map(step => `<label class="step-item"><input type="checkbox"> <span>${step}</span></label>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      saveBtn.classList.remove('hidden');
    }
    /* ==========================================================================
       >>> ANCHOR: TASK_CARD_RENDER_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: TASK_SORTING_LOGIC_START <<<
       ========================================================================== */
    window.moveTask = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentEvents.length) return;

      const item = currentEvents.splice(index, 1)[0];
      currentEvents.splice(targetIndex, 0, item);

      if (currentEvents.length > 0) {
        let [currentH, currentM] = currentEvents[0].start_time.split(':').map(Number);

        currentEvents.forEach(ev => {
          const duration = ev.duration_minutes || 30;
          const startStr = `${String(currentH).padStart(2, '0')}:${String(currentM).padStart(2, '0')}`;

          let endTotalMin = currentH * 60 + currentM + duration;
          let endH = Math.floor(endTotalMin / 60) % 24;
          let endM = endTotalMin % 60;
          const endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

          ev.start_time = startStr;
          ev.end_time = endStr;

          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      renderTaskList();
    };

    window.toggleSteps = function(index) {
      const el = document.getElementById(`steps_${index}`);
      if (el) el.classList.toggle('hidden');
    };
    /* ==========================================================================
       >>> ANCHOR: TASK_SORTING_LOGIC_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: TASK_API_PARSING_AND_SAVE_START <<<
       ========================================================================== */
    async function parseTasks() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Sorting...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ prompt: text })
        });

        const raw = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

        const data = JSON.parse(raw);
        currentEvents = data.events || [];
        renderTaskList();
        input.value = '';
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Parse & Sequence';
      }
    }

    async function saveToCalendar() {
      if (!currentEvents.length) return;
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Saving...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ action: 'INSERT', events: currentEvents })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Failed to save to Google Calendar/Sheets');
        }

        saveBtn.innerText = '✓ Saved Successfully';
        setTimeout(() => {
          currentEvents = [];
          renderTaskList();
          saveBtn.innerText = 'Write Order to Calendar';
          saveBtn.disabled = false;
        }, 1200);
      } catch (err) {
        alert(err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Write Order to Calendar';
      }
    }
    /* ==========================================================================
       >>> ANCHOR: TASK_API_PARSING_AND_SAVE_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: FORGE_CHAT_CLIENT_START <<<
       ========================================================================== */
    // 1. Silent Key Reader & Container Auth Fallback
    const urlParams = new URLSearchParams(window.location.search);
    const keyFromUrl = urlParams.get('key');
    if (keyFromUrl) {
      localStorage.setItem('app_key', keyFromUrl);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    
    let APP_KEY = localStorage.getItem('app_key') || '';
    if (!APP_KEY) {
      const promptedKey = prompt('Enter your App Key to unlock this device:');
      if (promptedKey) {
        localStorage.setItem('app_key', promptedKey.trim());
        APP_KEY = promptedKey.trim();
      }
    }

    let forgeHistory = JSON.parse(localStorage.getItem('forge_history') || '[]');

    function toggleForge() {
      const drawer = document.getElementById('forgeDrawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        renderForgeLog();
        document.getElementById('forgeInput').focus();
      }
    }

    function renderForgeLog() {
      const container = document.getElementById('forgeChatLog');
      container.innerHTML = '';

      if (forgeHistory.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;padding:12px;">Ask Gemini anything, iterate on UI features, or request live code patches. Memory persists across turns.</div>';
        return;
      }

      forgeHistory.forEach((msg, idx) => {
        const role = msg.role === 'model' ? 'model' : 'user';
        const text = msg.parts?.[0]?.text || '';
        appendChatMessageToDOM(role, text, idx);
      });

      container.scrollTop = container.scrollHeight;
    }

    function appendChatMessageToDOM(role, text, index) {
      const container = document.getElementById('forgeChatLog');
      const msgEl = document.createElement('div');
      msgEl.className = `chat-msg ${role}`;

      if (role === 'model') {
        msgEl.innerHTML = marked.parse(text);

        const hasCss = text.includes('```css') || text.includes('<style>');
        const hasJs = text.includes('```javascript') || text.includes('<script>');
        const hasAnchor = text.includes('>>> ANCHOR:');

        const actionRow = document.createElement('div');
        actionRow.className = 'patch-btn-row';

        if (hasCss || hasJs) {
          const patchBtn = document.createElement('button');
          patchBtn.className = 'btn-live-patch';
          patchBtn.innerText = '⚡ Apply Patch Live';
          patchBtn.onclick = () => hotPatchMessage(index);
          actionRow.appendChild(patchBtn);
        }

        if (hasAnchor || hasCss || hasJs) {
          const copyBtn = document.createElement('button');
          copyBtn.className = 'btn-live-patch';
          copyBtn.style.background = '#090e17';
          copyBtn.style.borderColor = 'var(--border)';
          copyBtn.innerText = '📋 Copy Code Block';
          copyBtn.onclick = () => copyCodeBlock(index, copyBtn);
          actionRow.appendChild(copyBtn);
        }

        if (actionRow.children.length > 0) {
          msgEl.appendChild(actionRow);
        }
      } else {
        msgEl.innerText = text;
      }

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    async function sendForgeMessage() {
      const input = document.getElementById('forgeInput');
      const btn = document.getElementById('forgeSendBtn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;

      forgeHistory.push({ role: 'user', parts: [{ text }] });
      renderForgeLog();

      const container = document.getElementById('forgeChatLog');
      const typingEl = document.createElement('div');
      typingEl.id = 'typingIndicator';
      typingEl.className = 'chat-msg model';
      typingEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      container.appendChild(typingEl);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ action: 'DEV_FORGE', history: forgeHistory })
        });

        const data = await res.json();
        document.getElementById('typingIndicator')?.remove();

        const reply = data.response || 'No response returned.';
        forgeHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (forgeHistory.length > 30) forgeHistory = forgeHistory.slice(-30);
        localStorage.setItem('forge_history', JSON.stringify(forgeHistory));

        renderForgeLog();
      } catch (err) {
        document.getElementById('typingIndicator')?.remove();
        appendChatMessageToDOM('model', `**Error:** ${err.message}`, 9999);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    window.hotPatchMessage = function(index) {
      const msg = forgeHistory[index];
      if (!msg) return;
      const text = msg.parts?.[0]?.text || '';

      const cssMatch = text.match(/```css([\s\S]*?)```/) || text.match(/<style>([\s\S]*?)<\/style>/);
      if (cssMatch) {
        const style = document.createElement('style');
        style.innerHTML = cssMatch[1];
        document.head.appendChild(style);
      }

      const jsMatch = text.match(/```javascript([\s\S]*?)```/) || text.match(/<script>([\s\S]*?)<\/script>/);
      if (jsMatch) {
        try {
          eval(jsMatch[1]);
        } catch (e) {
          alert('JS Patch Error: ' + e.message);
          return;
        }
      }

      alert('⚡ Patch applied to active page session!');
    };

    window.copyCodeBlock = async function(index, btnEl) {
      const msg = forgeHistory[index];
      if (!msg) return;
      const text = msg.parts?.[0]?.text || '';

      const fenceMatch = text.match(/```(?:css|javascript|html)?([\s\S]*?)```/);
      let payload = fenceMatch ? fenceMatch[1].trim() : text.trim();

      if (text.includes('CSS_THEME_AND_LAYOUT') && !payload.includes('<style>')) {
        payload = `  <!-- ==========================================================================\n       >>> ANCHOR: CSS_THEME_AND_LAYOUT_START <<<\n       ========================================================================== -->\n  <style>\n${payload}\n  </style>\n  <!-- ==========================================================================\n       >>> ANCHOR: CSS_THEME_AND_LAYOUT_END <<<\n       ========================================================================== -->`;
      }

      try {
        await navigator.clipboard.writeText(payload);
        const originalText = btnEl.innerText;
        btnEl.innerText = '✓ Copied Safe Block!';
        btnEl.style.borderColor = 'var(--success)';
        btnEl.style.color = 'var(--success)';
        setTimeout(() => {
          btnEl.innerText = originalText;
          btnEl.style.borderColor = 'var(--border)';
          btnEl.style.color = 'var(--text)';
        }, 1500);
      } catch (e) {
        alert('Clipboard copy failed: ' + e.message);
      }
    };

    function clearForgeChat() {
      if (!confirm('Clear Forge conversation history?')) return;
      forgeHistory = [];
      localStorage.removeItem('forge_history');
      renderForgeLog();
    }
    /* ==========================================================================
       >>> ANCHOR: FORGE_CHAT_CLIENT_END <<<
       ========================================================================== */


/* ==========================================================================
       >>> ANCHOR: VOICE_RECOGNITION_SETUP_START <<<
       ========================================================================== */
    const micBtn = document.getElementById('micBtn');
    const promptInput = document.getElementById('promptInput');
    const hopperVoiceBtn = document.getElementById('hopperVoiceBtn');
    const hopperInput = document.getElementById('hopperInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function createRecognizer(buttonEl, onTranscript) {
      if (!SpeechRecognition) {
        buttonEl.onclick = () => {
          alert('Web Speech API is unavailable in this container. Use the iOS keyboard microphone for seamless dictation.');
        };
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.interimResults = false;
      rec.lang = 'en-US';

      let isRecording = false;
      let activeStream = null;

      rec.onstart = () => {
        isRecording = true;
        buttonEl.classList.add(buttonEl.id === 'hopperVoiceBtn' ? 'recording' : 'listening');
      };

      rec.onend = () => {
        isRecording = false;
        buttonEl.classList.remove('recording', 'listening');
        if (activeStream) {
          activeStream.getTracks().forEach(track => track.stop());
          activeStream = null;
        }
      };

      rec.onerror = (e) => {
        isRecording = false;
        buttonEl.classList.remove('recording', 'listening');
        if (activeStream) {
          activeStream.getTracks().forEach(track => track.stop());
          activeStream = null;
        }
        if (e.error !== 'no-speech' && e.error !== 'aborted') {
          alert(`Speech Engine Error: ${e.error}`);
        }
      };

      rec.onresult = (e) => {
        const text = e.results?.[0]?.[0]?.transcript || '';
        if (text) onTranscript(text);
      };

      buttonEl.onclick = async () => {
        try {
          if (isRecording) {
            rec.stop();
            return;
          }

          // Prime iOS audio hardware explicitly before invoking speech recognition
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (permErr) {
              console.warn('Microphone stream priming skipped or rejected:', permErr);
            }
          }

          rec.start();
        } catch (err) {
          console.error('Recognition start failure:', err);
          isRecording = false;
          buttonEl.classList.remove('recording', 'listening');
        }
      };

      return rec;
    }

    // 1. Sequencer Mic
    createRecognizer(micBtn, (transcript) => {
      promptInput.value = transcript;
      parseTasks();
    });

    // 2. Dedicated Hopper Voice Button (Dictate -> Auto LLM Ingestion)
    createRecognizer(hopperVoiceBtn, (transcript) => {
      hopperInput.value = transcript;
      parseHopperInput();
    });

    // Hopper Enter Key Trigger
    hopperInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        parseHopperInput();
      }
    });

    document.getElementById('submitBtn').onclick = parseTasks;
    document.getElementById('forgeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendForgeMessage();
    });

    // Tray Toggle
    const toggleHopperBtn = document.getElementById('toggleHopperTray');
    if (toggleHopperBtn) {
      toggleHopperBtn.addEventListener('click', () => {
        const tray = document.getElementById('hopperTray');
        const chevron = document.getElementById('hopperChevron');
        if (tray) {
          const isCollapsed = tray.classList.toggle('collapsed');
          if (chevron) chevron.textContent = isCollapsed ? '▼' : '▲';
        }
      });
    }

    renderHopper();
    /* ==========================================================================
       >>> ANCHOR: VOICE_RECOGNITION_SETUP_END <<<
       ========================================================================== */
  </script>
</body>
