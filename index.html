<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Task Sequencer</title>

  <!-- iOS Standalone Full-Screen App Meta Tags -->
  <meta name="theme-color" content="#0d0708">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ==========================================================================
       >>> ANCHOR: CSS_THEME_AND_LAYOUT_START <<<
       ========================================================================== -->
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --ptt-orange: #f97316;
      --ptt-glow: rgba(249, 115, 22, 0.45);
      --record-red: #ef4444;

      --tag-11: #38bdf8;
      --tag-8: #a855f7;
      --tag-2: #ec4899;
      --tag-9: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px 80px 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body.recording-locked {
      overflow: hidden !important;
      touch-action: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .badge {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 8px;
      border-radius: 9999px;
    }

    /* THE MINIMAL HOPPER */
    .hopper-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hopper-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hopper-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .hopper-input-wrap input {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }
    .hopper-input-wrap input:focus { outline: 1px solid var(--primary); border-color: var(--primary); }

    .btn-hopper-submit {
      background: #111c2e;
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      height: 42px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .btn-hopper-submit:hover { background: #0c4a6e; border-color: var(--primary); color: #fff; }
    .btn-hopper-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-hopper-submit.ptt-active {
      background: var(--ptt-orange) !important;
      border-color: var(--ptt-orange) !important;
      color: #fff !important;
      box-shadow: 0 0 16px var(--ptt-glow);
      transform: scale(0.97);
    }

    .hopper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 2px 2px;
    }

    .hopper-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hopper-count-badge {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 9999px;
    }

    .hopper-chevron {
      color: var(--text-muted);
      font-size: 0.7rem;
      transition: transform 0.2s ease;
    }

    .hopper-tray.collapsed { display: none; }

    .hopper-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 4px;
    }

    .hopper-card {
      background: #090e17;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .hopper-card.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
    }

    .hopper-check {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #111c2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .hopper-check:checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .hopper-check:checked::after {
      content: '✓';
      color: #090e17;
      font-size: 0.75rem;
      font-weight: 900;
    }

    .hopper-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      flex: 1;
      word-break: break-word;
      cursor: pointer;
    }

    .hopper-actions { display: flex; gap: 4px; align-items: center; }

    .hopper-delete-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 4px 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .hopper-delete-btn:hover { color: var(--record-red); }

    .hopper-batch-bar {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn-stage-hopper {
      flex: 1;
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-stage-hopper:hover { background: #0369a1; color: #fff; }

    .btn-clear-selection {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 6px 8px;
    }
    .btn-clear-selection:hover { color: var(--text); }

    .hopper-empty {
      padding: 8px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* TODAY'S WORKBENCH (REFINED SEQUENCER PANEL) */
    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .workbench-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .workbench-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .workbench-counter {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Staged Chips Flow */
    .staged-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 2px 0;
    }
    .staged-chips-container.hidden { display: none; }

    .staged-chip {
      background: #090e17;
      border: 1px solid #0284c7;
      color: #e0f2fe;
      border-radius: 6px;
      padding: 4px 8px 4px 10px;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }
    .staged-chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }
    .staged-chip-remove {
      background: transparent;
      border: none;
      color: #7dd3fc;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0 2px;
      line-height: 1;
    }
    .staged-chip-remove:hover { color: #f87171; }

    textarea {
      width: 100%;
      min-height: 70px;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
      line-height: 1.4;
    }
    textarea:focus { outline: 1px solid var(--primary); border-color: var(--primary); }

    /* Energy & Rhythm Modifiers */
    .pacing-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .pacing-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-right: 2px;
    }
    .pacing-pill {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      user-select: none;
    }
    .pacing-pill:hover { border-color: var(--primary); color: var(--text); }
    .pacing-pill.active {
      background: #0c4a6e;
      border-color: var(--primary);
      color: #38bdf8;
    }

    /* Workbench Controls Footer */
    .workbench-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }

    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
      transition: background 0.15s ease;
    }
    button.btn-main:hover { background: var(--primary-hover); color: #fff; }
    button.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-workbench-reset {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0 12px;
      height: 44px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .btn-workbench-reset:hover { color: var(--record-red); border-color: var(--record-red); }

    /* Task Sorting List */
    .task-list { display: flex; flex-direction: column; gap: 10px; }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 4px solid var(--primary);
    }

    .task-card[data-color="11"] { border-left-color: var(--tag-11); }
    .task-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .task-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .task-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .task-title { font-size: 0.95rem; font-weight: 600; line-height: 1.35; }
    .sort-controls { display: flex; gap: 4px; }
    .btn-arrow {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-arrow:hover { color: var(--text); border-color: var(--primary); }

    .task-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-split {
      background: #0c4a6e;
      border: 1px solid #0284c7;
      color: #bae6fd;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .step-checklist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .step-item {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-save {
      background: #0284c7;
      color: white;
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover { background: #0369a1; }
    .btn-save:disabled { opacity: 0.5; }

    /* Forge */
    .forge-pill {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: 16px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      z-index: 999;
    }
    .forge-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #090e17;
      border-top: 2px solid var(--primary);
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
      z-index: 1000;
      height: 80vh;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 14px 14px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .forge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
      border-radius: 14px 14px 0 0;
    }
    .forge-title { font-size: 0.82rem; font-weight: 700; color: var(--primary); }
    .forge-header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }

    .forge-chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
      line-height: 1.45;
      font-size: 0.85rem;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px 12px 2px 12px;
      border: 1px solid var(--border);
    }
    .chat-msg.model {
      align-self: flex-start;
      background: #131c2e;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px 12px 12px 2px;
      border: 1px solid #1e293b;
    }
    .patch-btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-live-patch {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .forge-input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: #0f172a;
      display: flex;
      gap: 8px;
    }
    .forge-input-bar input {
      flex: 1;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.88rem;
    }
    .forge-input-bar button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .typing-dots { display: inline-flex; gap: 4px; padding: 4px 8px; }
    .typing-dots span { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    .hidden { display: none !important; }
  </style>

  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <span class="badge">Standalone</span>
    </header>

    <!-- THE MINIMAL HOPPER -->
    <section class="hopper-section">
      <div class="hopper-bar">
        <div class="hopper-input-wrap">
          <input 
            type="text" 
            id="hopperInput" 
            placeholder="Quick dump (or hold Capture to speak)..." 
            autocomplete="off" 
          />
        </div>
        <button type="button" id="hopperAddBtn" class="btn-hopper-submit">Capture</button>
      </div>

      <div class="hopper-header" id="toggleHopperTray">
        <span class="hopper-title">
          <span>The Hopper</span>
          <span class="hopper-count-badge" id="hopperCount">0</span>
        </span>
        <span class="hopper-chevron" id="hopperChevron">▼</span>
      </div>

      <div class="hopper-tray collapsed" id="hopperTray">
        <div id="hopperList" class="hopper-items">
          <!-- Dynamic Hopper Cards -->
        </div>
      </div>
    </section>

    <!-- TODAY'S WORKBENCH (SEQUENCER PANEL) -->
    <section class="input-panel">
      <div class="workbench-header">
        <span class="workbench-label">Today's Workbench</span>
        <span class="workbench-counter" id="workbenchCount">0 items staged</span>
      </div>

      <!-- Hopper Chips Tray -->
      <div id="stagedChips" class="staged-chips-container hidden"></div>

      <!-- Anchor / Context Notes -->
      <textarea 
        id="promptInput" 
        placeholder="Morning context & fixed anchors (e.g. 'Meeting at 10, workout at 4, feeling low energy')..."
      ></textarea>

      <!-- Energy & Pacing Pills -->
      <div class="pacing-row">
        <span class="pacing-label">Rhythm:</span>
        <span class="pacing-pill" data-mode="balanced" onclick="selectPacing(this)">⚡ Balanced</span>
        <span class="pacing-pill" data-mode="low-friction" onclick="selectPacing(this)">🛡️ Low Friction</span>
        <span class="pacing-pill" data-mode="sprint" onclick="selectPacing(this)">🔥 Focus Sprint</span>
      </div>

      <!-- Action Row -->
      <div class="workbench-actions">
        <button id="submitBtn" class="btn-main" type="button">Sequence Today</button>
        <button type="button" class="btn-workbench-reset" title="Clear Workbench" onclick="resetWorkbench()">✕</button>
      </div>
    </section>

    <!-- RESULTING TIMELINE -->
    <div id="taskList" class="task-list"></div>

    <button id="saveBtn" class="btn-save hidden" onclick="saveToCalendar()">Write Order to Calendar</button>
  </div>

  <!-- FLOATING FORGE BUTTON -->
  <button id="forgeToggle" class="forge-pill" onclick="toggleForge()">✦ Forge</button>

  <!-- GEMINI FORGE DRAWER -->
  <div id="forgeDrawer" class="forge-drawer hidden">
    <div class="forge-header">
      <div class="forge-title">✦ GEMINI COMPANION</div>
      <div class="forge-header-actions">
        <button class="btn-icon" onclick="clearForgeChat()">Clear History</button>
        <button class="btn-close" onclick="toggleForge()">✕</button>
      </div>
    </div>
    
    <div id="forgeChatLog" class="forge-chat-log"></div>

    <div class="forge-input-bar">
      <input id="forgeInput" placeholder="Chat with Gemini or request code tweaks..." autocomplete="off" />
      <button id="forgeSendBtn" onclick="sendForgeMessage()">Send</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://personal-scheduler-proxy.strand-troy.workers.dev';
    const APP_KEY = 'sequencer-lock-52984'; // Replace with your actual Cloudflare CLIENT_ACCESS_KEY
    let currentEvents = [];

 /* ==========================================================================
       >>> ANCHOR: TASK_CARD_RENDER_START <<<
       ========================================================================== */
    let hopperItems = JSON.parse(localStorage.getItem('hopper_items') || '[]');

    window.moveTask = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentEvents.length) return;

      const item = currentEvents.splice(index, 1)[0];
      currentEvents.splice(targetIndex, 0, item);

      if (currentEvents.length > 0) {
        let [currentH, currentM] = currentEvents[0].start_time.split(':').map(Number);

        currentEvents.forEach(ev => {
          const duration = ev.duration_minutes || 30;
          const startStr = `${String(currentH).padStart(2, '0')}:${String(currentM).padStart(2, '0')}`;

          let endTotalMin = currentH * 60 + currentM + duration;
          let endH = Math.floor(endTotalMin / 60) % 24;
          let endM = endTotalMin % 60;
          const endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

          ev.start_time = startStr;
          ev.end_time = endStr;

          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      renderTaskList();
    };

    async function parseTasks() {

      const btn = document.getElementById('submitBtn');

      if (stagedWorkbenchTasks.length === 0 && !contextText) {

        return;

      const originalBtnText = btn.innerText;

      // Assemble unified prompt payload
      let promptParts = [];
      if (stagedWorkbenchTasks.length > 0) {
        promptParts.push('Specific obligations to sequence into today:\n' + stagedWorkbenchTasks.map(t => `- ${t.text}`).join('\n'));
      }
      if (contextText) {
        promptParts.push(`Daily anchors and context:\n${contextText}`);
      }
      if (activePacingMode === 'low-friction') {
        promptParts.push('PACING DIRECTIVE: Low-friction / spoon-saver mode. Generous 15m transition buffers between tasks, sequence high-friction administrative items earlier or break them down heavily, protect rest periods.');
      } else if (activePacingMode === 'sprint') {
        promptParts.push('PACING DIRECTIVE: Focus sprint mode. Tight sequencing, consolidate similar administrative items together, minimize downtime.');
      }

      const finalPrompt = promptParts.join('\n\n');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Key': APP_KEY
          },
          body: JSON.stringify({ prompt: finalPrompt })
        });

        const raw = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

        const data = JSON.parse(raw);
        currentEvents = data.events || [];
        renderTaskList();

        // Remove sequenced tasks from Hopper permanently
        const sequencedIds = stagedWorkbenchTasks.map(t => t.id);
        hopperItems = hopperItems.filter(item => !sequencedIds.includes(item.id));
        saveHopper();

        // Clear workbench
        resetWorkbench();

        alert('Sequencing failed: ' + err.message);
        btn.innerText = originalBtnText;

        if (tray) {
          const isCollapsed = tray.classList.toggle('collapsed');
          if (chevron) chevron.textContent = isCollapsed ? '▼' : '▲';
        }
      });
    }

    renderHopper();
    renderWorkbench();
    /* ==========================================================================
       >>> ANCHOR: VOICE_RECOGNITION_SETUP_END <<<
       ========================================================================== */
  </script>
</body>
