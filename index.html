<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Task Sequencer</title>

  <!-- iOS Standalone Full-Screen App Meta Tags -->
  <meta name="theme-color" content="#0d0708">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!--███████████████████████████████████████████████████████████████████████████
    ▼▼▼ ANCHOR: CSS_THEME_AND_LAYOUT_START ▼▼▼
████████████████████████████████████████████████████████████████████████████-->
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --ptt-orange: #f97316;
      --ptt-glow: rgba(249, 115, 22, 0.45);
      --record-red: #ef4444;

      --tag-11: #38bdf8;
      --tag-8: #a855f7;
      --tag-2: #ec4899;
      --tag-9: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px 80px 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }

    /* VIEW SWITCHER TABS */
    .view-tabs {
      display: flex;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .view-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-tab.active {
      background: var(--card-bg);
      color: var(--primary);
    }

    /* THE MINIMAL HOPPER */
    .hopper-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hopper-bar { display: flex; gap: 8px; align-items: center; }
    .hopper-input-wrap { flex: 1; display: flex; align-items: center; }
    .hopper-input-wrap input {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }
    .hopper-input-wrap input:focus { outline: 1px solid var(--primary); border-color: var(--primary); }

    .btn-hopper-submit {
      background: #111c2e;
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      height: 42px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-hopper-submit:hover { background: #0c4a6e; border-color: var(--primary); color: #fff; }
    .btn-hopper-submit.ptt-active {
      background: var(--ptt-orange) !important;
      border-color: var(--ptt-orange) !important;
      color: #fff !important;
      box-shadow: 0 0 16px var(--ptt-glow);
    }

    .hopper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 2px 2px;
    }
    .hopper-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hopper-count-badge {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 9999px;
    }
    .hopper-chevron { color: var(--text-muted); font-size: 0.7rem; }
    .hopper-tray.collapsed { display: none; }
    .hopper-items { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }

    .hopper-card {
      background: #090e17;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hopper-card.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }

    .hopper-check {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #111c2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hopper-check:checked { background: var(--primary); border-color: var(--primary); }
    .hopper-check:checked::after { content: '✓'; color: #090e17; font-size: 0.75rem; font-weight: 900; }
    .hopper-text { font-size: 0.85rem; color: var(--text-sub); flex: 1; cursor: pointer; }
    .hopper-actions { display: flex; gap: 4px; align-items: center; }
    .hopper-delete-btn { background: transparent; color: var(--text-muted); border: none; padding: 4px 6px; font-size: 0.75rem; cursor: pointer; }
    .hopper-delete-btn:hover { color: var(--record-red); }

    .hopper-batch-bar {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .btn-stage-hopper {
      flex: 1;
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-clear-selection { background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; }
    .hopper-empty { padding: 8px; text-align: center; color: var(--text-muted); font-size: 0.8rem; }

    /* WORKBENCH PANEL */
    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .workbench-header { display: flex; justify-content: space-between; align-items: center; }
    .workbench-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
    .workbench-counter { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

    .staged-chips-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .staged-chip {
      background: #090e17;
      border: 1px solid #0284c7;
      color: #e0f2fe;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .staged-chip-remove { background: transparent; border: none; color: #7dd3fc; cursor: pointer; }

    textarea {
      width: 100%;
      min-height: 70px;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }
    textarea:focus { outline: 1px solid var(--primary); }

    .workbench-actions { display: flex; gap: 8px; align-items: center; }
    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-workbench-reset {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0 12px;
      height: 44px;
      cursor: pointer;
    }

    /* BUNDLED BLOCKS LIST (STAGING) */
    .blocks-container { display: flex; flex-direction: column; gap: 12px; }

    .block-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 4px solid var(--primary);
    }
    .block-card[data-color="11"] { border-left-color: var(--tag-11); }
    .block-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .block-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .block-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .block-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .block-title-row { display: flex; flex-direction: column; gap: 2px; }
    .block-title { font-size: 0.96rem; font-weight: 700; }
    .block-badge-domain {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .block-time { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    /* ATOMS LIST (INSIDE A BLOCK) */
    .block-atoms-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #090e17;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border);
    }

    .atom-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: #e2e8f0;
      padding: 4px 6px;
      border-radius: 4px;
      background: #111c2e;
    }
    .atom-item.done { text-decoration: line-through; opacity: 0.45; }
    .atom-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .atom-check {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #090e17;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .atom-check:checked { background: var(--primary); border-color: var(--primary); }
    .atom-check:checked::after { content: '✓'; color: #090e17; font-size: 0.65rem; font-weight: 900; }

    .atom-controls { display: flex; gap: 4px; align-items: center; }
    .btn-atom-split {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.68rem;
      cursor: pointer;
    }
    .btn-atom-split:hover { color: var(--primary); border-color: var(--primary); }

    /* SAVE BUTTON */
    .btn-save {
      background: #0284c7;
      color: white;
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover { background: #0369a1; }

    /* TRACK VIEW */
    .track-active-banner {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-active-label { font-size: 0.68rem; text-transform: uppercase; font-weight: 800; color: #bae6fd; }
    .track-active-title { font-size: 1rem; font-weight: 700; color: #fff; }

    /* FORGE */
    .forge-pill {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: 16px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      z-index: 999;
    }
    .forge-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #090e17;
      border-top: 2px solid var(--primary);
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
      z-index: 1000;
      height: 80vh;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 14px 14px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .forge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
      border-radius: 14px 14px 0 0;
    }
    .forge-title { font-size: 0.82rem; font-weight: 700; color: var(--primary); }
    .forge-header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }

    .forge-chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
      line-height: 1.45;
      font-size: 0.85rem;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px 12px 2px 12px;
      border: 1px solid var(--border);
    }
    .chat-msg.model {
      align-self: flex-start;
      background: #131c2e;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px 12px 12px 2px;
      border: 1px solid #1e293b;
    }
    .patch-btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-live-patch {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .forge-input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: #0f172a;
      display: flex;
      gap: 8px;
    }
    .forge-input-bar input {
      flex: 1;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.88rem;
    }
    .forge-input-bar button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
<!--███████████████████████████████████████████████████████████████████████████
    ▲▲▲ ANCHOR: CSS_THEME_AND_LAYOUT_END ▲▲▲
████████████████████████████████████████████████████████████████████████████-->
  
</head>
<body>

<!--███████████████████████████████████████████████████████████████████████████
    ▼▼▼ ANCHOR: DOM_STRUCTURE_START ▼▼▼
████████████████████████████████████████████████████████████████████████████-->
  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <div class="view-tabs">
        <button type="button" class="view-tab active" id="tabPlan" onclick="switchView('plan')">Plan & Bundle</button>
        <button type="button" class="view-tab" id="tabTrack" onclick="switchView('track')">Track Today</button>
      </div>
    </header>

    <!-- VIEW 1: PLANNING & BUNDLING -->
    <div id="viewPlan">
      <!-- THE MINIMAL HOPPER -->
      <section class="hopper-section">
        <div class="hopper-bar">
          <div class="hopper-input-wrap">
            <input 
              type="text" 
              id="hopperInput" 
              placeholder="Quick dump (or tap Capture to speak)..." 
              autocomplete="off" 
            />
          </div>
          <button type="button" id="hopperAddBtn" class="btn-hopper-submit">Capture</button>
        </div>

        <div class="hopper-header" id="toggleHopperTray">
          <span class="hopper-title">
            <span>The Hopper</span>
            <span class="hopper-count-badge" id="hopperCount">0</span>
          </span>
          <span class="hopper-chevron" id="hopperChevron">▼</span>
        </div>

        <div class="hopper-tray collapsed" id="hopperTray">
          <div id="hopperList" class="hopper-items">
            <!-- Dynamic Hopper Cards -->
          </div>
        </div>
      </section>

      <!-- TODAY'S WORKBENCH -->
      <section class="input-panel" style="margin-top: 14px;">
        <div class="workbench-header">
          <span class="workbench-label">Today's Workbench</span>
          <span class="workbench-counter" id="workbenchCount">0 items staged</span>
        </div>

        <div id="stagedChips" class="staged-chips-container hidden"></div>

        <textarea 
          id="promptInput" 
          placeholder="Morning context & fixed anchors (e.g. 'Meeting at 10, gym at 4, low energy today')..."
        ></textarea>

        <div class="workbench-actions">
          <button id="submitBtn" class="btn-main" type="button">⚡ Bundle & Sequence</button>
          <button type="button" class="btn-workbench-reset" title="Clear Workbench" onclick="resetWorkbench()">✕</button>
        </div>
      </section>

      <!-- RESULTING BUNDLED BLOCKS -->
      <div id="blocksContainer" class="blocks-container" style="margin-top: 14px;"></div>

      <button id="saveBtn" class="btn-save hidden" onclick="saveToCalendar()" style="width: 100%;">
        Write Schedule to Calendar & Start Tracking
      </button>
    </div>

    <!-- VIEW 2: EXECUTION / TRACK MODE -->
    <div id="viewTrack" class="hidden">
      <div id="trackActiveBanner" class="track-active-banner hidden" style="margin-bottom: 12px;"></div>
      <div id="trackBlocksContainer" class="blocks-container"></div>
    </div>
  </div>

  <!-- FLOATING FORGE BUTTON -->
  <button id="forgeToggle" class="forge-pill" onclick="toggleForge()">✦ Forge</button>

  <!-- GEMINI FORGE DRAWER -->
  <div id="forgeDrawer" class="forge-drawer hidden">
    <div class="forge-header">
      <div class="forge-title">✦ GEMINI COMPANION</div>
      <div class="forge-header-actions">
        <button class="btn-icon" onclick="clearForgeChat()">Clear History</button>
        <button class="btn-close" onclick="toggleForge()">✕</button>
      </div>
    </div>
    <div id="forgeChatLog" class="forge-chat-log"></div>
    <div class="forge-input-bar">
      <input id="forgeInput" placeholder="Chat with Gemini or request code tweaks..." autocomplete="off" />
      <button id="forgeSendBtn" onclick="sendForgeMessage()">Send</button>
    </div>
  </div>
<!--███████████████████████████████████████████████████████████████████████████
    ▲▲▲ ANCHOR: DOM_STRUCTURE_END ▲▲▲
████████████████████████████████████████████████████████████████████████████-->

  <script>
    const WORKER_URL = 'https://personal-scheduler-proxy.strand-troy.workers.dev';
    const APP_KEY = 'sequencer-lock-52984'; // Replace with your actual Cloudflare CLIENT_ACCESS_KEY
    let currentEvents = [];

/*█████████████████████████████████████████████████████████████████████████████
  ▼▼▼ ANCHOR: TASK_CARD_RENDER_START ▼▼▼
█████████████████████████████████████████████████████████████████████████████*/
    let currentBlocks = JSON.parse(localStorage.getItem('current_blocks') || '[]');
    let currentView = 'plan'; // 'plan' | 'track'

    window.switchView = function(viewName) {
      currentView = viewName;
      const tabPlan = document.getElementById('tabPlan');
      const tabTrack = document.getElementById('tabTrack');
      const viewPlan = document.getElementById('viewPlan');
      const viewTrack = document.getElementById('viewTrack');

      if (tabPlan) tabPlan.classList.toggle('active', viewName === 'plan');
      if (tabTrack) tabTrack.classList.toggle('active', viewName === 'track');
      if (viewPlan) viewPlan.classList.toggle('hidden', viewName !== 'plan');
      if (viewTrack) viewTrack.classList.toggle('hidden', viewName !== 'track');

      if (viewName === 'track') {
        renderTrackView();
      } else {
        renderBlocks();
      }
    };

    let hopperItems = JSON.parse(localStorage.getItem('hopper_items') || '[]');
    let selectedHopperIds = new Set();
    let stagedWorkbenchTasks = [];

    function saveHopper() {
      localStorage.setItem('hopper_items', JSON.stringify(hopperItems));
      renderHopper();
    }

    function renderHopper() {
      const listEl = document.getElementById('hopperList');
      const countEl = document.getElementById('hopperCount');
      if (!listEl || !countEl) return;

      countEl.textContent = hopperItems.length;

      if (hopperItems.length === 0) {
        listEl.innerHTML = '<div class="hopper-empty">Hopper is clear. Mind is free.</div>';
        selectedHopperIds.clear();
        return;
      }

      const itemsMarkup = hopperItems.map((item) => {
        const isChecked = selectedHopperIds.has(item.id);
        return `
          <div class="hopper-card ${isChecked ? 'selected' : ''}" id="card_${item.id}">
            <input 
              type="checkbox" 
              class="hopper-check" 
              ${isChecked ? 'checked' : ''} 
              onchange="toggleHopperSelection('${item.id}', this.checked)"
            />

    window.moveBlock = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentBlocks.length) return;

      const item = currentBlocks.splice(index, 1)[0];
      currentBlocks.splice(targetIndex, 0, item);

      if (currentBlocks.length > 0) {
        let [currentH, currentM] = (currentBlocks[0].start_time || '08:00').split(':').map(Number);

        currentBlocks.forEach(blk => {
          const duration = blk.duration_minutes || 30;
          const startStr = `${String(currentH).padStart(2, '0')}:${String(currentM).padStart(2, '0')}`;

          let endTotalMin = currentH * 60 + currentM + duration;
          let endH = Math.floor(endTotalMin / 60) % 24;
          let endM = endTotalMin % 60;
          const endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

          blk.start_time = startStr;
          blk.end_time = endStr;

          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      localStorage.setItem('current_blocks', JSON.stringify(currentBlocks));
      renderBlocks();
    };

          }

          isRecordingPTT = true;
          buttonEl.classList.add('ptt-active');
          buttonEl.innerText = 'Done';

          const mimeType = getSupportedMimeType();
          audioChunks = [];

          try {
            mediaRecorder = mimeType ? new MediaRecorder(currentStream, { mimeType }) : new MediaRecorder(currentStream);
          } catch (e) {
            mediaRecorder = new MediaRecorder(currentStream);
          }

          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) {
              audioChunks.push(ev.data);
            }
          };

          mediaRecorder.onstop = async () => {
            if (currentStream) {
              currentStream.getTracks().forEach(t => t.stop());
              currentStream = null;
            }
            buttonEl.classList.remove('ptt-active');
            buttonEl.innerText = originalText;

            if (audioChunks.length === 0) return;

            const finalMime = mediaRecorder.mimeType || mimeType || 'audio/mp4';
            const audioBlob = new Blob(audioChunks, { type: finalMime });

            try {
              const base64Data = await blobToBase64(audioBlob);
              onAudioCaptured({ data: base64Data, mimeType: finalMime });
            } catch (encodeErr) {
              alert('Failed to process audio: ' + encodeErr.message);
            }
          };

          mediaRecorder.start(250);
        } else {
          // 2. If we ARE currently recording, this tap stops and sequences it
          isRecordingPTT = false;
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try { mediaRecorder.requestData(); } catch (err) {}
            mediaRecorder.stop();
          }
        }
      });
    }
    
    // Attach PTT to Hopper Capture
    attachHardwarePTT(
      hopperAddBtn,
      (audioPayload) => parseHopperInput(audioPayload),
      () => parseHopperInput()
    );

    // Sequence tap
    if (submitBtn) {
      submitBtn.onclick = () => parseTasks();
    }

    // Hopper Enter Key Trigger
    if (hopperInput) {
      hopperInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          parseHopperInput();
        }
      });
    }

    // Forge Drawer Key Trigger
    const forgeInput = document.getElementById('forgeInput');
    if (forgeInput) {
      forgeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendForgeMessage();
      });
    }

    // Hopper Tray Toggle
    const toggleHopperBtn = document.getElementById('toggleHopperTray');
    if (toggleHopperBtn) {
      toggleHopperBtn.addEventListener('click', () => {
        const tray = document.getElementById('hopperTray');
        const chevron = document.getElementById('hopperChevron');
        if (tray) {
          const isCollapsed = tray.classList.toggle('collapsed');
          if (chevron) chevron.textContent = isCollapsed ? '▼' : '▲';
        }
      });
    }

    renderHopper();
    renderWorkbench();

  </script>
