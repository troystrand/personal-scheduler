<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Scheduler</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --gcal: #2563eb;
      --gcal-hover: #1d4ed8;
      --error-bg: #451a1a;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus { outline: 2px solid var(--primary); }

    button.btn-primary {
      background: var(--primary);
      color: #0b1120;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .event-card {
      border: 1px solid var(--border);
      background: #111827;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-title { font-size: 1.25rem; font-weight: 600; color: #fff; }
    .event-detail { font-size: 0.95rem; color: var(--text-muted); display: flex; gap: 8px; }
    .event-detail strong { color: var(--text); }

    .btn-gcal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gcal);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 8px;
      transition: background 0.15s ease;
    }

    .btn-gcal:hover
