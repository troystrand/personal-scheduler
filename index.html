<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Scheduler</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --gcal: #2563eb;
      --ics: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus { outline: 2px solid var(--primary); }

    button.btn-primary {
      background: var(--primary);
      color: #0b1120;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .event-card {
      border: 1px solid var(--border);
      background: #111827;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-title { font-size: 1.2rem; font-weight: 600; color: #fff; }
    .event-detail { font-size: 0.92rem; color: var(--text-muted); display: flex; gap: 8px; }
    .event-detail strong { color: var(--text); }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      color: white;
      transition: opacity 0.15s ease;
    }

    .btn-link:hover { opacity: 0.9; }
    .btn-gcal { background: var(--gcal); }
    .btn-ics { background: var(--ics); }

    pre {
      background: #0b1120;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #a5f3fc;
      overflow-x: auto;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>Personal Scheduler</h1>
      <p class="subtitle">Enter any scheduling phrase to extract details and generate calendar entries.</p>
    </div>

    <div class="card">
      <textarea id="promptInput" placeholder="e.g., Sync with Dalton on Monday at 3:30pm for 45 minutes at the library"></textarea>
      <button id="submitBtn" class="btn-primary" onclick="processSchedule()">Process Request</button>
    </div>

    <div id="outputContainer" class="card hidden">
      <div id="renderedEvent"></div>
      <pre id="rawJson"></pre>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';

    async function processSchedule() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const outputContainer = document.getElementById('outputContainer');
      const renderedEvent = document.getElementById('renderedEvent');
      const rawJson = document.getElementById('rawJson');

      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Parsing...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        if (!response.ok) {
          const errData = await response.text();
          throw new Error(`HTTP ${response.status}: ${errData}`);
        }

        const data = await response.json();

        rawJson.innerText = JSON.stringify(data, null, 2);
        renderEventCard(data);
        outputContainer.classList.remove('hidden');
      } catch (err) {
        rawJson.innerText = `Error: ${err.message}`;
        renderedEvent.innerHTML = '';
        outputContainer.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Process Request';
      }
    }

    function renderEventCard(ev) {
      const container = document.getElementById('renderedEvent');
      if (ev.action !== 'CREATE_EVENT' && ev.action !== 'UPDATE_EVENT') {
        container.innerHTML = `<p class="event-detail">Action parsed: <strong>${ev.action || 'UNKNOWN'}</strong></p>`;
        return;
      }

      // Convert YYYY-MM-DD + HH:MM into URL & ICS formats
      const cleanDate = (ev.date || '').replace(/-/g, '');
      const cleanStart = (ev.start_time || '').replace(/:/g, '') + '00';
      const cleanEnd = (ev.end_time || '').replace(/:/g, '') + '00';
      const datesParam = `${cleanDate}T${cleanStart}/${cleanDate}T${cleanEnd}`;

      // Google Calendar deep link
      const gcal = new URL('https://calendar.google.com/calendar/render');
      gcal.searchParams.set('action', 'TEMPLATE');
      gcal.searchParams.set('text', ev.title || 'Scheduled Event');
      gcal.searchParams.set('dates', datesParam);
      if (ev.location) gcal.searchParams.set('location', ev.location);
      if (ev.description) gcal.searchParams.set('details', ev.description);
      gcal.searchParams.set('ctz', 'America/Chicago');

      // RFC 5545 iCalendar content (.ics)
      const icsLines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Personal Scheduler//EN',
        'BEGIN:VEVENT',
        `UID:${Date.now()}@personalscheduler`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        `DTSTART;TZID=America/Chicago:${cleanDate}T${cleanStart}`,
        `DTEND;TZID=America/Chicago:${cleanDate}T${cleanEnd}`,
        `SUMMARY:${ev.title || 'Scheduled Event'}`,
        ev.location ? `LOCATION:${ev.location}` : '',
        ev.description ? `DESCRIPTION:${ev.description}` : '',
        'END:VEVENT',
        'END:VCALENDAR'
      ].filter(Boolean).join('\r\n');

      const blob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
      const icsUrl = URL.createObjectURL(blob);
      const icsFileName = `${(ev.title || 'event').toLowerCase().replace(/\s+/g, '_')}.ics`;

      container.innerHTML = `
        <div class="event-card">
          <div class="event-title">${ev.title || 'New Event'}</div>
          <div class="event-detail"><span>Date:</span> <strong>${ev.date}</strong></div>
          <div class="event-detail"><span>Time:</span> <strong>${ev.start_time} - ${ev.end_time}</strong> (America/Chicago)</div>
          ${ev.location ? `<div class="event-detail"><span>Location:</span> <strong>${ev.location}</strong></div>` : ''}
          <div class="action-row">
            <a href="${gcal.toString()}" target="_blank" rel="noopener noreferrer" class="btn-link btn-gcal">
              + Google Calendar
            </a>
            <a href="${icsUrl}" download="${icsFileName}" class="btn-link btn-ics">
              Download .ICS
            </a>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
