<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Scheduler</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scheduler">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --gcal: #2563eb;
      --gcal-hover: #1d4ed8;
      --mic-active: #ef4444;
      --error-bg: #451a1a;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .version-tag {
      font-size: 0.75rem;
      color: var(--primary);
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus { outline: 2px solid var(--primary); }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button.btn-primary {
      flex: 1;
      background: var(--primary);
      color: #0b1120;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    button.btn-mic {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.btn-mic:hover {
      background: #334155;
    }

    button.btn-mic.listening {
      background: var(--mic-active);
      border-color: var(--mic-active);
      color: white;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .mic-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .event-card {
      border: 1px solid var(--border);
      background: #111827;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-title { font-size: 1.25rem; font-weight: 600; color: #fff; }
    .event-detail { font-size: 0.95rem; color: var(--text-muted); display: flex; gap: 8px; }
    .event-detail strong { color: var(--text); }

    .btn-gcal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gcal);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 8px;
      transition: background 0.15s ease;
    }

    .btn-gcal:hover { background: var(--gcal-hover); }

    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>Personal Scheduler</h1>
      <p class="subtitle">Parse natural language scheduling requests straight to Google Calendar.</p>
      <div class="version-tag">VERSION 1.6</div>
    </div>

    <div class="card">
      <textarea id="promptInput" placeholder="e.g., Sync with Dalton on Monday at 3:30pm for 45 minutes at the library (Press Enter to send)"></textarea>
      
      <div class="button-group">
        <button id="micBtn" class="btn-mic" type="button" title="Speak to dictate">
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button id="submitBtn" class="btn-primary">Process Request</button>
      </div>
    </div>

    <div id="outputContainer" class="card hidden">
      <div id="renderedEvent"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';

    function formatReadableDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      
      const year = parseInt(parts[0], 10);
      const monthIdx = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);
      
      const months = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
      const monthName = months[monthIdx] || parts[1];
      const currentYear = new Date().getFullYear();

      if (year === currentYear) {
        return monthName + ' ' + day;
      }
      return monthName + ' ' + day + ', ' + year;
    }

    function formatTimeComponent(timeStr) {
      if (!timeStr) return { hour: 0, minute: 0, ampm: 'am', display: '' };
      const parts = timeStr.split(':');
      let hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1] || '0', 10);
      const ampm = hour >= 12 ? 'pm' : 'am';
      
      hour = hour % 12;
      if (hour === 0) hour = 12;

      const minStr = minute === 0 ? '' : ':' + (minute < 10 ? '0' + minute : minute);
      return { hour, minute, ampm, minStr, display: hour + minStr };
    }

    function formatReadableTimeRange(startTime, endTime) {
      if (!startTime) return '';
      const start = formatTimeComponent(startTime);

      if (!endTime || endTime === startTime) {
        return start.display + start.ampm;
      }

      const end = formatTimeComponent(endTime);

      // If both am or both pm, omit the first am/pm: 6-7pm vs 11:30am-1pm
      if (start.ampm === end.ampm) {
        return start.display + '–' + end.display + end.ampm;
      }
      return start.display + start.ampm + '–' + end.display + end.ampm;
    }

    function buildCalendarUrl(ev) {
      const cleanDate = (ev.date || '').replace(/-/g, '');
      const cleanStart = (ev.start_time || '').replace(/:/g, '') + '00';
      const cleanEnd = (ev.end_time || '').replace(/:/g, '') + '00';
      const datesParam = cleanDate + 'T' + cleanStart + '/' + cleanDate + 'T' + cleanEnd;

      const gcal = new URL('https://calendar.google.com/calendar/render');
      gcal.searchParams.set('action', 'TEMPLATE');
      gcal.searchParams.set('text', ev.title || 'Scheduled Event');
      gcal.searchParams.set('dates', datesParam);
      if (ev.location) gcal.searchParams.set('location', ev.location);
      if (ev.description) gcal.searchParams.set('details', ev.description);
      gcal.searchParams.set('ctz', 'America/Chicago');

      return gcal.toString();
    }

    function renderEventCard(ev, targetUrl) {
      const container = document.getElementById('renderedEvent');
      const dateDisplay = formatReadableDate(ev.date);
      const timeDisplay = formatReadableTimeRange(ev.start_time, ev.end_time);

      container.innerHTML = 
        '<div class="event-card">' +
          '<div class="event-title">' + (ev.title || 'New Event') + '</div>' +
          '<div class="event-detail"><span>Date:</span> <strong>' + dateDisplay + '</strong></div>' +
          '<div class="event-detail"><span>Time:</span> <strong>' + timeDisplay + '</strong></div>' +
          (ev.location ? '<div class="event-detail"><span>Location:</span> <strong>' + ev.location + '</strong></div>' : '') +
          '<a href="' + targetUrl + '" target="_blank" rel="noopener noreferrer" class="btn-gcal">' +
            'Add to Calendar' +
          '</a>' +
        '</div>';
    }

    async function processSchedule() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const outputContainer = document.getElementById('outputContainer');
      const renderedEvent = document.getElementById('renderedEvent');

      const text = input.value.trim();
      if (!text) return;

      // Pre-open blank tab synchronously on click/tap to bypass popup blocker
      const calWindow = window.open('about:blank', '_blank');

      btn.disabled = true;
      btn.innerText = 'Parsing...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        if (!response.ok) {
          const errData = await response.text();
          throw new Error('HTTP ' + response.status + ': ' + errData);
        }

        const data = await response.json();
        const calendarUrl = buildCalendarUrl(data);

        renderEventCard(data, calendarUrl);
        outputContainer.classList.remove('hidden');

        input.value = '';
        input.focus();

        // Redirect the pre-opened tab to the parsed calendar URL
        if (calWindow) {
          calWindow.location.href = calendarUrl;
        }
      } catch (err) {
        if (calWindow) calWindow.close();
        renderedEvent.innerHTML = '<div class="error-banner">Error: ' + err.message + '</div>';
        outputContainer.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Process Request';
      }
    }

    // Voice dictation setup
    const micBtn = document.getElementById('micBtn');
    const promptInput = document.getElementById('promptInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        micBtn.classList.add('listening');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        promptInput.value = transcript;
        processSchedule();
      };

      recognition.onerror = function(event) {
        console.error('Speech error:', event.error);
        micBtn.classList.remove('listening');
      };

      recognition.onend = function() {
        micBtn.classList.remove('listening');
      };

      micBtn.addEventListener('click', function() {
        if (micBtn.classList.contains('listening')) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });
    } else {
      micBtn.style.display = 'none';
    }

    document.getElementById('submitBtn').addEventListener('click', processSchedule);

    document.getElementById('promptInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processSchedule();
      }
    });
  </script>
</body>
</html>
