<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Scheduler</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scheduler">
  <style>
    :root {
      --bg: #070d19;
      --card-bg: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --gcal: #2563eb;
      --gcal-hover: #1d4ed8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;

      --color-11: #ef4444; /* High Cognitive Tax / Tomato */
      --color-4: #f472b6;  /* Social / Flamingo */
      --color-8: #64748b;  /* Chores & Errands / Graphite */
      --color-2: #10b981;  /* Restorative / Sage */
      --color-9: #6366f1;  /* Anchor Appointments / Blueberry */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Pinned Horizon Bar */
    .horizon-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .horizon-pill {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #c7d2fe;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      white-space: nowrap;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .horizon-pill strong { color: #fff; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    .version-tag { font-size: 0.75rem; color: var(--primary); font-weight: 600; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    textarea {
      width: 100%;
      min-height: 85px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: 2px solid var(--primary); }

    .button-group { display: flex; gap: 10px; align-items: center; }

    button.btn-primary {
      flex: 1;
      background: var(--primary);
      color: #030712;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    button.btn-mic {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.btn-mic.listening {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .mic-icon { width: 20px; height: 20px; fill: currentColor; }
    .mic-status { font-size: 0.8rem; color: var(--text-muted); min-height: 16px; }

    /* Energy Barometer SVG Curve */
    .barometer-container {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .barometer-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .curve-svg { width: 100%; height: 60px; overflow: visible; }

    /* Interactive Timeline Controls */
    .timeline-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timeline-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    
    .view-toggle {
      display: flex;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .view-btn.active {
      background: #1e293b;
      color: var(--primary);
    }

    /* THE BUBBLE CANVAS */
    #bubbleCanvasContainer {
      position: relative;
      width: 100%;
      height: 240px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    #bubbleCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .bubble-hint {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Cognitive Physics: Event Flow */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
    }

    .event-card {
      border: 1px solid var(--border);
      background: #111827;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-left: 6px solid var(--primary);
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
    }

    .event-card[data-color="11"] { border-left-color: var(--color-11); }
    .event-card[data-color="4"]  { border-left-color: var(--color-4); }
    .event-card[data-color="8"]  { border-left-color: var(--color-8); }
    .event-card[data-color="2"]  { border-left-color: var(--color-2); }
    .event-card[data-color="9"]  { border-left-color: var(--color-9); }

    .event-card.mass-light { width: 82%; background: #0f172a; border-color: #334155; }
    .event-card.mass-medium { width: 92%; }
    .event-card.mass-heavy {
      width: 100%;
      border-color: #7f1d1d;
      background: repeating-linear-gradient(
        -45deg,
        #111827,
        #111827 8px,
        #1f1414 8px,
        #1f1414 16px
      );
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.15), inset 0 0 12px rgba(239, 68, 68, 0.08);
    }

    .initiation-ramp {
      position: absolute;
      top: -1px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 0 0 6px 6px;
    }
    .ramp-sheer { background: #7f1d1d; color: #fca5a5; border: 1px solid #b91c1c; border-top: none; }
    .ramp-moderate { background: #451a03; color: #fed7aa; border: 1px solid #c2410c; border-top: none; }
    .ramp-flat { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; border-top: none; }

    .event-card.momentum-booster {
      border-color: #059669;
      background: #064e3b18;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.15);
    }
    .momentum-filament {
      width: 2px;
      height: 12px;
      background: linear-gradient(to bottom, #10b981, transparent);
      margin: -6px 0;
      border-radius: 1px;
    }

    .event-card.existing { opacity: 0.85; border-style: dashed; }
    .event-header { display: flex; justify-content: space-between; align-items: baseline; padding-top: 4px; }
    .event-title { font-size: 1.05rem; font-weight: 600; color: #fff; }
    .event-detail { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 8px; }
    .event-detail strong { color: var(--text); }

    .micro-starter {
      background: #18181b;
      border-left: 2px solid var(--danger);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-top: 4px;
      line-height: 1.35;
    }

    .plan-summary {
      font-size: 0.9rem;
      color: var(--primary);
      background: #082f49;
      border: 1px solid #0369a1;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.4;
    }

    .btn-action {
      background: var(--gcal);
      color: white;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    .btn-action:hover { background: var(--gcal-hover); }
    .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-action.success { background: var(--success); cursor: default; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Pinned Horizon Anchors -->
    <div class="horizon-bar">
      <div class="horizon-pill"><span>🎯</span> <strong>Licensure Review</strong> (5d)</div>
      <div class="horizon-pill"><span>🌲</span> <strong>Jay Cooke Trip</strong> (16d)</div>
      <div class="horizon-pill"><span>📦</span> <strong>Laser Restock</strong> (24d)</div>
    </div>

    <div class="header-row">
      <h1>Personal Scheduler</h1>
      <div class="version-tag">VERSION 2.3</div>
    </div>

    <div class="card">
      <textarea id="promptInput" placeholder="Morning dump: 'Meeting at 9, grade portfolios, lift at 1, post office run, coffee with Dalton at 3'"></textarea>
      <div class="mic-status" id="micStatus"></div>
      <div class="button-group">
        <button id="micBtn" class="btn-mic" type="button" title="Speak to dictate">
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button id="submitBtn" class="btn-primary">Process Plan</button>
      </div>
    </div>

    <!-- Active Calendar Dashboard -->
    <div id="outputContainer" class="card">
      <div class="timeline-nav">
        <span class="timeline-title">Cognitive Physics Dashboard</span>
        <div class="view-toggle">
          <button id="viewBubblesBtn" class="view-btn active" onclick="switchView('bubbles')">Bubbles</button>
          <button id="viewCardsBtn" class="view-btn" onclick="switchView('cards')">Cards</button>
        </div>
      </div>

      <!-- Energy Barometer SVG Curve -->
      <div class="barometer-container">
        <div class="barometer-title">
          <span>Projected Energy Reserves</span>
          <span id="fuelScoreText">Ready</span>
        </div>
        <svg id="curveSvg" class="curve-svg" viewBox="0 0 400 60"></svg>
      </div>

      <!-- VIEW A: POPPABLE BUBBLE CANVAS -->
      <div id="bubbleCanvasContainer">
        <canvas id="bubbleCanvas"></canvas>
        <div class="bubble-hint">⚡ Tap high-friction red bubbles to pop & split into micro-sprints</div>
      </div>

      <!-- VIEW B: PHYSICAL CARDS TIMELINE -->
      <div id="planSummary" class="plan-summary hidden"></div>
      <div id="eventsContainer" class="events-list hidden"></div>
      
      <button id="saveAllBtn" class="btn-action hidden" onclick="commitPendingEvents()">Add New Events to Calendar</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';
    let combinedEvents = [];
    let pendingEvents = [];
    let activeView = 'bubbles';

    // Physics Bubble Simulation
    let bubbles = [];
    let animFrame = null;
    const canvas = document.getElementById('bubbleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);

    function initBubbles(events) {
      resizeCanvas();
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;

      bubbles = events.map((ev, i) => {
        const delta = ev.energy_delta || 0;
        const friction = ev.initiation_friction || 2;
        
        // Radius based on cognitive mass
        let r = 24;
        if (delta <= -2) r = 40 + friction * 4;
        else if (delta >= 1) r = 32;
        else r = 26;

        let color = '#6366f1';
        if (ev.color_id === '11' || delta <= -2) color = '#ef4444';
        else if (ev.color_id === '2' || delta >= 1) color = '#10b981';
        else if (ev.color_id === '4') color = '#f472b6';
        else if (ev.color_id === '8') color = '#64748b';

        return {
          id: ev.id || i,
          title: ev.title || 'Event',
          r: r,
          targetR: r,
          x: 40 + (i * ((w - 80) / Math.max(events.length - 1, 1))),
          y: h / 2 + (Math.sin(i) * 20),
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          color: color,
          friction: friction,
          delta: delta,
          isSplit: false
        };
      });

      if (!animFrame) runBubblePhysics();
    }

    function runBubblePhysics() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < bubbles.length; i++) {
        const b = bubbles[i];

        // Smooth growth/pop animation
        b.r += (b.targetR - b.r) * 0.15;

        // Gentle floating velocity
        b.x += b.vx;
        b.y += b.vy;

        // Wall collisions
        if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
        if (b.x + b.r > w) { b.x = w - b.r; b.vx *= -1; }
        if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; }
        if (b.y + b.r > h) { b.y = h - b.r; b.vy *= -1; }

        // Draw outer glow for high energy or high drain
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + (b.friction >= 4 ? 4 : 2), 0, Math.PI * 2);
        ctx.fillStyle = b.color + '22';
        ctx.fill();

        // Draw physical bubble body
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color + '44';
        ctx.fill();
        ctx.lineWidth = b.friction >= 4 ? 3 : 1.5;
        ctx.strokeStyle = b.color;
        ctx.stroke();

        // Draw Title text truncated inside bubble
        ctx.fillStyle = '#ffffff';
        ctx.font = '600 ' + Math.max(10, Math.min(13, b.r / 3.2)) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const maxLen = Math.floor(b.r / 3.5);
        const displayTitle = b.title.length > maxLen ? b.title.substring(0, maxLen - 1) + '…' : b.title;
        ctx.fillText(displayTitle, b.x, b.y);
      }

      animFrame = requestAnimationFrame(runBubblePhysics);
    }

    // Tap to POP and SPLIT heavy bubbles
    canvas.addEventListener('click', function(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(clickX - b.x, clickY - b.y);

        if (dist < b.r) {
          // If it's a high friction dread task, pop it into 2 micro-sprints!
          if (b.friction >= 4 && !b.isSplit) {
            b.isSplit = true;
            b.targetR = b.r * 0.65;
            b.title = 'Part 1 (15m)';
            b.color = '#f59e0b';
            b.vx = -1.5;

            // Spawn micro-satellite bubble
            bubbles.push({
              id: 'split_' + Date.now(),
              title: 'Part 2 (15m)',
              r: 10,
              targetR: b.r * 0.65,
              x: b.x + 30,
              y: b.y,
              vx: 1.5,
              vy: (Math.random() - 0.5) * 1.5,
              color: '#10b981',
              friction: 2,
              delta: 0,
              isSplit: true
            });

            if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
          } else {
            // Gentle tactile bounce
            b.vx += (Math.random() - 0.5) * 3;
            b.vy += (Math.random() - 0.5) * 3;
            if (navigator.vibrate) navigator.vibrate(15);
          }
          break;
        }
      }
    });

    function switchView(mode) {
      activeView = mode;
      const bubbleContainer = document.getElementById('bubbleCanvasContainer');
      const cardsContainer = document.getElementById('eventsContainer');
      const bubblesBtn = document.getElementById('viewBubblesBtn');
      const cardsBtn = document.getElementById('viewCardsBtn');

      if (mode === 'bubbles') {
        bubbleContainer.classList.remove('hidden');
        cardsContainer.classList.add('hidden');
        bubblesBtn.classList.add('active');
        cardsBtn.classList.remove('active');
        resizeCanvas();
      } else {
        bubbleContainer.classList.add('hidden');
        cardsContainer.classList.remove('hidden');
        bubblesBtn.classList.remove('active');
        cardsBtn.classList.add('active');
      }
    }

    function formatReadableDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const months = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
      const monthIdx = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);
      return (months[monthIdx] || parts[1]) + ' ' + day;
    }

    function formatTimeComponent(timeStr) {
      if (!timeStr) return { display: '', ampm: 'am' };
      const parts = timeStr.split(':');
      let hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1] || '0', 10);
      const ampm = hour >= 12 ? 'pm' : 'am';
      hour = hour % 12 || 12;
      const minStr = minute === 0 ? '' : ':' + (minute < 10 ? '0' + minute : minute);
      return { display: hour + minStr, ampm };
    }

    function formatReadableTimeRange(startTime, endTime) {
      if (!startTime) return '';
      const start = formatTimeComponent(startTime);
      if (!endTime || endTime === startTime) return start.display + start.ampm;
      const end = formatTimeComponent(endTime);
      return start.ampm === end.ampm 
        ? start.display + '–' + end.display + end.ampm
        : start.display + start.ampm + '–' + end.display + end.ampm;
    }

    function drawFuelBarometer(events) {
      const svg = document.getElementById('curveSvg');
      const scoreText = document.getElementById('fuelScoreText');
      if (!events || events.length === 0) {
        scoreText.innerText = 'Intake Ready';
        scoreText.style.color = 'var(--text-muted)';
        svg.innerHTML = '<line x1="0" y1="30" x2="400" y2="30" stroke="#334155" stroke-dasharray="4" stroke-width="1" />';
        return;
      }

      let currentFuel = 85;
      const points = [{ x: 10, y: currentFuel }];
      const step = 380 / Math.max(events.length, 1);
      let minFuel = 100;

      events.forEach((ev, idx) => {
        const delta = (ev.energy_delta || 0) * 12;
        currentFuel = Math.max(15, Math.min(95, currentFuel + delta));
        if (currentFuel < minFuel) minFuel = currentFuel;
        points.push({ x: 10 + (idx + 1) * step, y: currentFuel });
      });

      if (minFuel < 35) {
        scoreText.innerText = '⚠️ Exhaustion Risk Flagged';
        scoreText.style.color = 'var(--danger)';
      } else {
        scoreText.innerText = 'Balanced Energy Distribution';
        scoreText.style.color = 'var(--success)';
      }

      const pathData = points.map((p, i) => {
        const svgY = 60 - (p.y * 0.5);
        return (i === 0 ? 'M' : 'L') + p.x + ',' + svgY;
      }).join(' ');

      const strokeColor = minFuel < 35 ? '#ef4444' : '#38bdf8';
      svg.innerHTML = `
        <line x1="0" y1="42" x2="400" y2="42" stroke="#334155" stroke-dasharray="4" stroke-width="1" />
        <path d="${pathData}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" />
        ${points.map(p => `<circle cx="${p.x}" cy="${60 - (p.y * 0.5)}" r="3.5" fill="${strokeColor}" />`).join('')}
      `;
    }

    function renderEvents(events) {
      const container = document.getElementById('eventsContainer');
      if (!events.length) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:0.9rem;padding:12px 0;">No calendar events yet for today. Use the box above to schedule.</div>';
        return;
      }

      events.sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));

      let html = '';
      events.forEach((ev, idx) => {
        const dateDisplay = formatReadableDate(ev.date);
        const timeDisplay = formatReadableTimeRange(ev.start_time, ev.end_time);
        const delta = ev.energy_delta || 0;
        const friction = ev.initiation_friction || 2;

        let massClass = 'mass-medium';
        if (delta <= -2) massClass = 'mass-heavy';
        else if (delta >= 1 || ev.color_id === '8') massClass = 'mass-light';

        let momentumClass = '';
        if (delta >= 1 || ev.color_id === '2') {
          momentumClass = 'momentum-booster';
        }

        let rampHtml = '';
        if (friction >= 4) {
          rampHtml = '<div class="initiation-ramp ramp-sheer">▲ ' + (friction === 5 ? 'Sheer Cliff' : 'High Incline') + '</div>';
        } else if (friction === 3) {
          rampHtml = '<div class="initiation-ramp ramp-moderate">▲ Moderate Slope</div>';
        } else if (friction <= 1) {
          rampHtml = '<div class="initiation-ramp ramp-flat">● Effortless</div>';
        }

        let starterHtml = '';
        if (ev.description && friction >= 4) {
          starterHtml = '<div class="micro-starter">' + ev.description.replace(/\n/g, '<br>') + '</div>';
        }

        html += 
          '<div class="event-card ' + massClass + ' ' + momentumClass + ' ' + (ev.is_existing ? 'existing' : '') + '" data-color="' + (ev.color_id || '9') + '">' +
            rampHtml +
            '<div class="event-header">' +
              '<div class="event-title">' + (ev.title || 'Event') + '</div>' +
            '</div>' +
            '<div class="event-detail"><span>Time:</span> <strong>' + dateDisplay + ' · ' + timeDisplay + '</strong></div>' +
            (ev.location ? '<div class="event-detail"><span>Location:</span> <strong>' + ev.location + '</strong></div>' : '') +
            starterHtml +
          '</div>';

        if (momentumClass && idx < events.length - 1) {
          html += '<div class="momentum-filament"></div>';
        }
      });

      container.innerHTML = html;
    }

    async function loadLiveSchedule() {
      const scoreText = document.getElementById('fuelScoreText');
      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'LIST' })
        });
        const data = await response.json();
        const existing = data.events || [];
        combinedEvents = [...existing];

        drawFuelBarometer(combinedEvents);
        renderEvents(combinedEvents);
        initBubbles(combinedEvents);
      } catch (err) {
        scoreText.innerText = 'Intake Ready';
        drawFuelBarometer([]);
        renderEvents([]);
        initBubbles([]);
      }
    }

    async function commitPendingEvents() {
      if (!pendingEvents.length) return;
      const saveBtn = document.getElementById('saveAllBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Writing to Calendar...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'INSERT', events: pendingEvents })
        });
        if (!response.ok) throw new Error('Insert failed');

        saveBtn.classList.add('success');
        saveBtn.innerText = '✓ Added to Calendar';

        setTimeout(() => {
          pendingEvents = [];
          saveBtn.classList.add('hidden');
          loadLiveSchedule();
        }, 1200);
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Retry Adding';
        alert('Failed: ' + err.message);
      }
    }

    async function processSchedule() {
      stopVoice();
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const planSummary = document.getElementById('planSummary');
      const saveBtn = document.getElementById('saveAllBtn');

      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Simulating Physics Arc...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        if (!response.ok) throw new Error('Planning failed');

        const data = await response.json();
        pendingEvents = data.events || [];

        if (data.summary_message) {
          planSummary.innerText = data.summary_message;
          planSummary.classList.remove('hidden');
        }

        const merged = [...combinedEvents.filter(e => e.is_existing), ...pendingEvents];
        drawFuelBarometer(merged);
        renderEvents(merged);
        initBubbles(merged);

        saveBtn.disabled = false;
        saveBtn.classList.remove('success', 'hidden');
        saveBtn.innerText = pendingEvents.length > 1 
          ? 'Add All (' + pendingEvents.length + ') to Calendar' 
          : 'Add to Calendar';

        input.value = '';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Process Plan';
      }
    }

    // Hybrid Patience Speech Recognition
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const promptInput = document.getElementById('promptInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let silenceTimer = null;
    let isListening = false;

    function resetSilenceTimer() {
      if (silenceTimer) clearTimeout(silenceTimer);
      micStatus.innerText = 'Listening... (Speak freely, 6s cushion)';
      silenceTimer = setTimeout(() => {
        if (isListening && promptInput.value.trim().length > 0) {
          micStatus.innerText = 'Sequencing...';
          processSchedule();
        }
      }, 6000);
    }

    function stopVoice() {
      if (silenceTimer) clearTimeout(silenceTimer);
      if (recognition && isListening) recognition.stop();
      isListening = false;
      micBtn.classList.remove('listening');
      micStatus.innerText = '';
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        resetSilenceTimer();
      };
      recognition.onresult = function(event) {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + ' ';
        }
        promptInput.value = transcript.trim();
        resetSilenceTimer();
      };
      recognition.onerror = function() { stopVoice(); };
      recognition.onend = function() {
        if (isListening) try { recognition.start(); } catch(e) { stopVoice(); }
      };

      micBtn.addEventListener('click', function() {
        if (isListening) stopVoice();
        else { promptInput.value = ''; try { recognition.start(); } catch(e) {} }
      });
    }

    document.getElementById('submitBtn').addEventListener('click', processSchedule);
    document.getElementById('promptInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processSchedule();
      }
    });

    window.addEventListener('DOMContentLoaded', loadLiveSchedule);
  </script>
</body>
</html>
