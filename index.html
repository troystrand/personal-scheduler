<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Sequencer</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23304a;
      --text: #f1f5f9;
      --text-muted: #8192b0;
      --primary: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;

      --tag-11: #ef4444; /* High Friction / Tomato */
      --tag-8: #64748b;  /* Maintenance / Graphite */
      --tag-2: #10b981;  /* Restorative / Sage */
      --tag-9: #6366f1;  /* Appointment / Blueberry */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
    .badge { font-size: 0.75rem; color: var(--primary); background: #0c4a6e33; border: 1px solid #0284c7; padding: 2px 8px; border-radius: 9999px; }

    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--primary); }

    .button-row { display: flex; gap: 8px; }
    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #030712;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    button.btn-mic {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
    }
    button.btn-mic.listening { background: var(--danger); }

    /* Task Sorting List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 5px solid var(--primary);
    }

    .task-card[data-color="11"] { border-left-color: var(--tag-11); }
    .task-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .task-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .task-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .task-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .sort-controls {
      display: flex;
      gap: 4px;
    }

    .btn-arrow {
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-arrow:hover { color: var(--text); border-color: var(--primary); }

    .task-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-split {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      color: #c7d2fe;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .step-checklist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
    }

    .step-item {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-save {
      background: var(--success);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:disabled { opacity: 0.5; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <span class="badge">Sorting Baseline</span>
    </header>

    <div class="input-panel">
      <textarea id="promptInput" placeholder="Morning list: 'Grade 10 essays, mail package, 30m gym session, call Dalton at 2'"></textarea>
      <div class="button-row">
        <button id="micBtn" class="btn-mic" type="button">🎙</button>
        <button id="submitBtn" class="btn-main">Parse & Sequence</button>
      </div>
    </div>

    <div id="taskList" class="task-list"></div>

    <button id="saveBtn" class="btn-save hidden" onclick="saveToCalendar()">Write Order to Calendar</button>
  </div>

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';
    let currentEvents = [];

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      const m = parts[1] || '00';
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${m}${ampm}`;
    }

    function renderTaskList() {
      const container = document.getElementById('taskList');
      const saveBtn = document.getElementById('saveBtn');

      if (!currentEvents.length) {
        container.innerHTML = '';
        saveBtn.classList.add('hidden');
        return;
      }

      container.innerHTML = currentEvents.map((ev, index) => {
        const timeDisplay = `${formatTime12(ev.start_time)} – ${formatTime12(ev.end_time)}`;
        const hasSteps = ev.steps && ev.steps.length > 0;

        return `
          <div class="task-card" data-color="${ev.color_id || '9'}">
            <div class="task-header">
              <div class="task-title">${ev.title}</div>
              <div class="sort-controls">
                <button class="btn-arrow" onclick="moveTask(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>▲</button>
                <button class="btn-arrow" onclick="moveTask(${index}, 1)" ${index === currentEvents.length - 1 ? 'disabled style="opacity:0.3"' : ''}>▼</button>
              </div>
            </div>
            <div class="task-meta">
              <span>${timeDisplay} (${ev.duration_minutes || 30}m)</span>
              ${hasSteps ? `<button class="btn-split" onclick="toggleSteps(${index})">Micro-Steps</button>` : ''}
            </div>
            ${hasSteps ? `
              <div id="steps_${index}" class="step-checklist hidden">
                ${ev.steps.map(step => `<label class="step-item"><input type="checkbox"> <span>${step}</span></label>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      saveBtn.classList.remove('hidden');
    }

    // Moving tasks swaps their position and recalculates start/end times sequentially
    window.moveTask = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentEvents.length) return;

      const item = currentEvents.splice(index, 1)[0];
      currentEvents.splice(targetIndex, 0, item);

      // Re-anchor times starting from the very first event's original start
      if (currentEvents.length > 0) {
        let [currentH, currentM] = currentEvents[0].start_time.split(':').map(Number);

        currentEvents.forEach(ev => {
          const duration = ev.duration_minutes || 30;
          const startStr = `${String(currentH).padStart(2, '0')}:${String(currentM).padStart(2, '0')}`;

          let endTotalMin = currentH * 60 + currentM + duration;
          let endH = Math.floor(endTotalMin / 60) % 24;
          let endM = endTotalMin % 60;
          const endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

          ev.start_time = startStr;
          ev.end_time = endStr;

          // Add a 5m transition buffer for the next task
          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      renderTaskList();
    };

    window.toggleSteps = function(index) {
      const el = document.getElementById(`steps_${index}`);
      if (el) el.classList.toggle('hidden');
    };

    async function parseTasks() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Sorting...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const raw = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

        const data = JSON.parse(raw);
        currentEvents = data.events || [];
        renderTaskList();
        input.value = '';
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Parse & Sequence';
      }
    }

    async function saveToCalendar() {
      if (!currentEvents.length) return;
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Saving...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'INSERT', events: currentEvents })
        });

        if (!res.ok) throw new Error('Failed to save to Google Calendar');

        saveBtn.innerText = '✓ Saved Successfully';
        setTimeout(() => {
          currentEvents = [];
          renderTaskList();
          saveBtn.innerText = 'Write Order to Calendar';
          saveBtn.disabled = false;
        }, 1200);
      } catch (err) {
        alert(err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Write Order to Calendar';
      }
    }

    // Voice setup
    const micBtn = document.getElementById('micBtn');
    const promptInput = document.getElementById('promptInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.lang = 'en-US';

      rec.onstart = () => micBtn.classList.add('listening');
      rec.onend = () => micBtn.classList.remove('listening');
      rec.onresult = (e) => {
        promptInput.value = e.results[0][0].transcript;
        parseTasks();
      };

      micBtn.onclick = () => {
        try { rec.start(); } catch(e) { rec.stop(); }
      };
    }

    document.getElementById('submitBtn').onclick = parseTasks;
  </script>
</body>
</html>
