<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Task Sequencer</title>

  <!-- iOS Standalone Full-Screen App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sequencer">
  <meta name="theme-color" content="#0d0708">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ==========================================================================
       >>> ANCHOR: CSS_THEME_AND_LAYOUT_START <<<
       ========================================================================== -->
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #10b981;
      --danger: #ef4444;

      --tag-11: #38bdf8;
      --tag-8: #a855f7;
      --tag-2: #ec4899;
      --tag-9: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)) 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
    .badge {
      font-size: 0.75rem;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    textarea {
      width: 100%;
      min-height: 80px;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--primary); }

    .button-row { display: flex; gap: 8px; }
    button.btn-main {
      flex: 1;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
      transition: background 0.15s ease;
    }
    button.btn-main:hover { background: var(--primary-hover); color: #fff; }
    button.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    button.btn-mic {
      background: #111c2e;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
    }
    button.btn-mic.listening { background: var(--danger); }

    /* Task Sorting List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 5px solid var(--primary);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }
    .task-card:hover { border-color: var(--primary); }

    .task-card[data-color="11"] { border-left-color: var(--tag-11); }
    .task-card[data-color="8"]  { border-left-color: var(--tag-8); }
    .task-card[data-color="2"]  { border-left-color: var(--tag-2); }
    .task-card[data-color="9"]  { border-left-color: var(--tag-9); }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .task-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .sort-controls {
      display: flex;
      gap: 4px;
    }

    .btn-arrow {
      background: #090e17;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-arrow:hover { color: var(--text); border-color: var(--primary); }

    .task-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-split {
      background: #0c4a6e;
      border: 1px solid #0284c7;
      color: #bae6fd;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .step-checklist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .step-item {
      font-size: 0.8rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-save {
      background: #0284c7;
      color: white;
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }
    .btn-save:hover { background: #0369a1; }
    .btn-save:disabled { opacity: 0.5; }

    /* The Forge Chat Drawer Styles */
    .forge-pill {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: 16px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 12px rgba(56, 189, 248, 0.35);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .forge-pill:hover { background: var(--primary-hover); color: #fff; transform: translateY(-1px); }

    .forge-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #090e17;
      border-top: 2px solid var(--primary);
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
      z-index: 1000;
      height: 80vh;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 14px 14px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .forge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
      border-radius: 14px 14px 0 0;
    }
    .forge-title { font-size: 0.85rem; font-weight: 700; color: var(--primary); letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
    .forge-header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-icon:hover { color: var(--text); }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }

    .forge-chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
      line-height: 1.45;
      font-size: 0.88rem;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px 12px 2px 12px;
      border: 1px solid var(--border);
    }
    .chat-msg.model {
      align-self: flex-start;
      background: #131c2e;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px 12px 12px 2px;
      border: 1px solid #1e293b;
    }
    .chat-msg.model p { margin-bottom: 8px; }
    .chat-msg.model p:last-child { margin-bottom: 0; }
    .chat-msg.model code {
      background: #090e17;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--primary);
    }
    .chat-msg.model pre {
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .chat-msg.model pre code {
      background: none;
      padding: 0;
      color: #f1f5f9;
    }

    .patch-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .btn-live-patch {
      background: #0c4a6e;
      border: 1px solid var(--primary);
      color: #bae6fd;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-live-patch:hover { background: #0369a1; }

    .forge-input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: #0f172a;
      display: flex;
      gap: 8px;
    }
    .forge-input-bar input {
      flex: 1;
      background: #090e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .forge-input-bar input:focus { outline: 2px solid var(--primary); }
    .forge-input-bar button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .forge-input-bar button:disabled { opacity: 0.5; }

    .typing-dots { display: inline-flex; gap: 4px; padding: 4px 8px; }
    .typing-dots span { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    .hidden { display: none !important; }
  </style>
  <!-- ==========================================================================
       >>> ANCHOR: CSS_THEME_AND_LAYOUT_END <<<
       ========================================================================== -->
</head>
<body>

  <!-- ==========================================================================
       >>> ANCHOR: DOM_STRUCTURE_START <<<
       ========================================================================== -->
  <div class="container">
    <header>
      <h1>Task Sequencer</h1>
      <span class="badge">Standalone</span>
    </header>

    <div class="input-panel">
      <textarea id="promptInput" placeholder="Morning list: 'Grade 10 essays, mail package, 30m gym session, call Dalton at 2'"></textarea>
      <div class="button-row">
        <button id="micBtn" class="btn-mic" type="button">🎙</button>
        <button id="submitBtn" class="btn-main">Parse & Sequence</button>
      </div>
    </div>

    <div id="taskList" class="task-list"></div>

    <button id="saveBtn" class="btn-save hidden" onclick="saveToCalendar()">Write Order to Calendar</button>
  </div>

  <!-- FLOATING FORGE BUTTON -->
  <button id="forgeToggle" class="forge-pill" onclick="toggleForge()">✦ Gemini Forge</button>

  <!-- GEMINI FORGE MULTI-TURN DRAWER -->
  <div id="forgeDrawer" class="forge-drawer hidden">
    <div class="forge-header">
      <div class="forge-title">✦ GEMINI 3.8 COMPANION</div>
      <div class="forge-header-actions">
        <button class="btn-icon" onclick="clearForgeChat()">Clear History</button>
        <button class="btn-close" onclick="toggleForge()">✕</button>
      </div>
    </div>
    
    <div id="forgeChatLog" class="forge-chat-log"></div>

    <div class="forge-input-bar">
      <input id="forgeInput" placeholder="Chat with Gemini or request code tweaks..." autocomplete="off" />
      <button id="forgeSendBtn" onclick="sendForgeMessage()">Send</button>
    </div>
  </div>
  <!-- ==========================================================================
       >>> ANCHOR: DOM_STRUCTURE_END <<<
       ========================================================================== -->

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';
    let currentEvents = [];

    /* ==========================================================================
       >>> ANCHOR: TASK_CARD_RENDER_START <<<
       ========================================================================== */
    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      const m = parts[1] || '00';
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${m}${ampm}`;
    }

    function renderTaskList() {
      const container = document.getElementById('taskList');
      const saveBtn = document.getElementById('saveBtn');

      if (!currentEvents.length) {
        container.innerHTML = '';
        saveBtn.classList.add('hidden');
        return;
      }

      container.innerHTML = currentEvents.map((ev, index) => {
        const timeDisplay = `${formatTime12(ev.start_time)} – ${formatTime12(ev.end_time)}`;
        const hasSteps = ev.steps && ev.steps.length > 0;

        return `
          <div class="task-card" data-color="${ev.color_id || '9'}">
            <div class="task-header">
              <div class="task-title">${ev.title}</div>
              <div class="sort-controls">
                <button class="btn-arrow" onclick="moveTask(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>▲</button>
                <button class="btn-arrow" onclick="moveTask(${index}, 1)" ${index === currentEvents.length - 1 ? 'disabled style="opacity:0.3"' : ''}>▼</button>
              </div>
            </div>
            <div class="task-meta">
              <span>${timeDisplay} (${ev.duration_minutes || 30}m)</span>
              ${hasSteps ? `<button class="btn-split" onclick="toggleSteps(${index})">Micro-Steps</button>` : ''}
            </div>
            ${hasSteps ? `
              <div id="steps_${index}" class="step-checklist hidden">
                ${ev.steps.map(step => `<label class="step-item"><input type="checkbox"> <span>${step}</span></label>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      saveBtn.classList.remove('hidden');
    }
    /* ==========================================================================
       >>> ANCHOR: TASK_CARD_RENDER_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: TASK_SORTING_LOGIC_START <<<
       ========================================================================== */
    window.moveTask = function(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= currentEvents.length) return;

      const item = currentEvents.splice(index, 1)[0];
      currentEvents.splice(targetIndex, 0, item);

      if (currentEvents.length > 0) {
        let [currentH, currentM] = currentEvents[0].start_time.split(':').map(Number);

        currentEvents.forEach(ev => {
          const duration = ev.duration_minutes || 30;
          const startStr = `${String(currentH).padStart(2, '0')}:${String(currentM).padStart(2, '0')}`;

          let endTotalMin = currentH * 60 + currentM + duration;
          let endH = Math.floor(endTotalMin / 60) % 24;
          let endM = endTotalMin % 60;
          const endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

          ev.start_time = startStr;
          ev.end_time = endStr;

          let nextTotalMin = endTotalMin + 5;
          currentH = Math.floor(nextTotalMin / 60) % 24;
          currentM = nextTotalMin % 60;
        });
      }

      renderTaskList();
    };

    window.toggleSteps = function(index) {
      const el = document.getElementById(`steps_${index}`);
      if (el) el.classList.toggle('hidden');
    };
    /* ==========================================================================
       >>> ANCHOR: TASK_SORTING_LOGIC_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: TASK_API_PARSING_AND_SAVE_START <<<
       ========================================================================== */
    async function parseTasks() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Sorting...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const raw = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

        const data = JSON.parse(raw);
        currentEvents = data.events || [];
        renderTaskList();
        input.value = '';
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Parse & Sequence';
      }
    }

    async function saveToCalendar() {
      if (!currentEvents.length) return;
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Saving...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'INSERT', events: currentEvents })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Failed to save to Google Calendar/Sheets');
        }

        saveBtn.innerText = '✓ Saved Successfully';
        setTimeout(() => {
          currentEvents = [];
          renderTaskList();
          saveBtn.innerText = 'Write Order to Calendar';
          saveBtn.disabled = false;
        }, 1200);
      } catch (err) {
        alert(err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Write Order to Calendar';
      }
    }
    /* ==========================================================================
       >>> ANCHOR: TASK_API_PARSING_AND_SAVE_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: FORGE_CHAT_CLIENT_START <<<
       ========================================================================== */
    let forgeHistory = JSON.parse(localStorage.getItem('forge_history') || '[]');

    function toggleForge() {
      const drawer = document.getElementById('forgeDrawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        renderForgeLog();
        document.getElementById('forgeInput').focus();
      }
    }

    function renderForgeLog() {
      const container = document.getElementById('forgeChatLog');
      container.innerHTML = '';

      if (forgeHistory.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;padding:12px;">Ask Gemini anything, iterate on UI features, or request live code patches. Memory persists across turns.</div>';
        return;
      }

      forgeHistory.forEach((msg, idx) => {
        const role = msg.role === 'model' ? 'model' : 'user';
        const text = msg.parts?.[0]?.text || '';
        appendChatMessageToDOM(role, text, idx);
      });

      container.scrollTop = container.scrollHeight;
    }

    function appendChatMessageToDOM(role, text, index) {
      const container = document.getElementById('forgeChatLog');
      const msgEl = document.createElement('div');
      msgEl.className = `chat-msg ${role}`;

      if (role === 'model') {
        msgEl.innerHTML = marked.parse(text);

        const hasCss = text.includes('```css') || text.includes('<style>');
        const hasJs = text.includes('```javascript') || text.includes('<script>');
        const hasAnchor = text.includes('>>> ANCHOR:');

        const actionRow = document.createElement('div');
        actionRow.className = 'patch-btn-row';

        // 1. Live patch button for real-time testing
        if (hasCss || hasJs) {
          const patchBtn = document.createElement('button');
          patchBtn.className = 'btn-live-patch';
          patchBtn.innerText = '⚡ Apply Patch Live';
          patchBtn.onclick = () => hotPatchMessage(index);
          actionRow.appendChild(patchBtn);
        }

        // 2. Mobile-friendly one-tap copy button for GitHub mobile app
        if (hasAnchor || hasCss || hasJs) {
          const copyBtn = document.createElement('button');
          copyBtn.className = 'btn-live-patch';
          copyBtn.style.background = '#1e0c10';
          copyBtn.style.borderColor = '#5c1d24';
          copyBtn.innerText = '📋 Copy Code Block';
          copyBtn.onclick = () => copyCodeBlock(index, copyBtn);
          actionRow.appendChild(copyBtn);
        }

        if (actionRow.children.length > 0) {
          msgEl.appendChild(actionRow);
        }
      } else {
        msgEl.innerText = text;
      }

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    async function sendForgeMessage() {
      const input = document.getElementById('forgeInput');
      const btn = document.getElementById('forgeSendBtn');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      btn.disabled = true;

      forgeHistory.push({ role: 'user', parts: [{ text }] });
      renderForgeLog();

      const container = document.getElementById('forgeChatLog');
      const typingEl = document.createElement('div');
      typingEl.id = 'typingIndicator';
      typingEl.className = 'chat-msg model';
      typingEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      container.appendChild(typingEl);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'DEV_FORGE', history: forgeHistory })
        });

        const data = await res.json();
        document.getElementById('typingIndicator')?.remove();

        const reply = data.response || 'No response returned.';
        forgeHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (forgeHistory.length > 30) forgeHistory = forgeHistory.slice(-30);
        localStorage.setItem('forge_history', JSON.stringify(forgeHistory));

        renderForgeLog();
      } catch (err) {
        document.getElementById('typingIndicator')?.remove();
        appendChatMessageToDOM('model', `**Error:** ${err.message}`, 9999);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    window.hotPatchMessage = function(index) {
      const msg = forgeHistory[index];
      if (!msg) return;
      const text = msg.parts?.[0]?.text || '';

      const cssMatch = text.match(/```css([\s\S]*?)```/) || text.match(/<style>([\s\S]*?)<\/style>/);
      if (cssMatch) {
        const style = document.createElement('style');
        style.innerHTML = cssMatch[1];
        document.head.appendChild(style);
      }

      const jsMatch = text.match(/```javascript([\s\S]*?)```/) || text.match(/<script>([\s\S]*?)<\/script>/);
      if (jsMatch) {
        try {
          eval(jsMatch[1]);
        } catch (e) {
          alert('JS Patch Error: ' + e.message);
          return;
        }
      }

      alert('⚡ Patch applied to active page session!');
    };

    window.copyCodeBlock = async function(index, btnEl) {
      const msg = forgeHistory[index];
      if (!msg) return;
      const text = msg.parts?.[0]?.text || '';

      const fenceMatch = text.match(/```(?:css|javascript|html)?([\s\S]*?)```/);
      const codeToCopy = fenceMatch ? fenceMatch[1].trim() : text;

      try {
        await navigator.clipboard.writeText(codeToCopy);
        const originalText = btnEl.innerText;
        btnEl.innerText = '✓ Copied!';
        btnEl.style.borderColor = 'var(--success)';
        btnEl.style.color = 'var(--success)';
        setTimeout(() => {
          btnEl.innerText = originalText;
          btnEl.style.borderColor = '#5c1d24';
          btnEl.style.color = '#fca5a5';
        }, 1500);
      } catch (e) {
        alert('Clipboard copy failed: ' + e.message);
      }
    };

    function clearForgeChat() {
      if (!confirm('Clear Forge conversation history?')) return;
      forgeHistory = [];
      localStorage.removeItem('forge_history');
      renderForgeLog();
    }
    /* ==========================================================================
       >>> ANCHOR: FORGE_CHAT_CLIENT_END <<<
       ========================================================================== */


    /* ==========================================================================
       >>> ANCHOR: VOICE_RECOGNITION_SETUP_START <<<
       ========================================================================== */
    const micBtn = document.getElementById('micBtn');
    const promptInput = document.getElementById('promptInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.lang = 'en-US';

      rec.onstart = () => micBtn.classList.add('listening');
      rec.onend = () => micBtn.classList.remove('listening');
      rec.onresult = (e) => {
        promptInput.value = e.results[0][0].transcript;
        parseTasks();
      };

      micBtn.onclick = () => {
        try { rec.start(); } catch(e) { rec.stop(); }
      };
    }

    document.getElementById('submitBtn').onclick = parseTasks;
    document.getElementById('forgeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendForgeMessage();
    });
    /* ==========================================================================
       >>> ANCHOR: VOICE_RECOGNITION_SETUP_END <<<
       ========================================================================== */
  </script>
</body>
</html>
