<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Scheduler</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scheduler">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --gcal: #2563eb;
      --gcal-hover: #1d4ed8;
      --success: #22c55e;
      --mic-active: #ef4444;
      --error-bg: #451a1a;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;

      /* GCal Energy Colors */
      --color-11: #d50000; /* Tomato (Deep Work) */
      --color-4: #e67c73;  /* Flamingo (Social) */
      --color-8: #616161;  /* Graphite (Errands) */
      --color-2: #7cb342;  /* Sage (Restoration) */
      --color-9: #3f51b5;  /* Blueberry (Fixed Anchor) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .version-tag {
      font-size: 0.75rem;
      color: var(--primary);
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus { outline: 2px solid var(--primary); }

    .button-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button.btn-primary {
      flex: 1;
      background: var(--primary);
      color: #0b1120;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    button.btn-mic {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    button.btn-mic:hover { background: #334155; }

    button.btn-mic.listening {
      background: var(--mic-active);
      border-color: var(--mic-active);
      color: white;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .mic-icon { width: 20px; height: 20px; fill: currentColor; }

    .mic-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-height: 18px;
    }

    /* Event Previews */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-card {
      border: 1px solid var(--border);
      background: #111827;
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 6px solid var(--primary);
    }

    .event-card[data-color="11"] { border-left-color: var(--color-11); }
    .event-card[data-color="4"]  { border-left-color: var(--color-4); }
    .event-card[data-color="8"]  { border-left-color: var(--color-8); }
    .event-card[data-color="2"]  { border-left-color: var(--color-2); }
    .event-card[data-color="9"]  { border-left-color: var(--color-9); }

    .event-title { font-size: 1.15rem; font-weight: 600; color: #fff; }
    .event-detail { font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 8px; }
    .event-detail strong { color: var(--text); }

    .plan-summary {
      font-size: 0.95rem;
      color: var(--primary);
      background: #082f49;
      border: 1px solid #0369a1;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.4;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gcal);
      color: white;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
      width: 100%;
    }

    .btn-action:hover { background: var(--gcal-hover); }
    .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-action.success { background: var(--success); cursor: default; }

    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>Personal Scheduler</h1>
      <p class="subtitle">Natural voice calendar engine with executive energy planning.</p>
      <div class="version-tag">VERSION 1.8</div>
    </div>

    <div class="card">
      <textarea id="promptInput" placeholder="Speak or type: 'Sync with Dalton at 2pm' or dump your whole day: 'Meeting at 9, gym at 11:30, target run, dinner with friends at 7'"></textarea>
      
      <div class="mic-status" id="micStatus"></div>

      <div class="button-group">
        <button id="micBtn" class="btn-mic" type="button" title="Voice Input">
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button id="submitBtn" class="btn-primary">Process Request</button>
      </div>
    </div>

    <div id="outputContainer" class="card hidden">
      <div id="planSummary" class="plan-summary hidden"></div>
      <div id="eventsContainer" class="events-list"></div>
      <button id="saveAllBtn" class="btn-action" onclick="commitAllEvents()">Add All to Calendar</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://gemini-proxy.strand-troy.workers.dev';
    let currentParsedEvents = [];

    function formatReadableDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      
      const year = parseInt(parts[0], 10);
      const monthIdx = parseInt(parts[1], 10) - 1;
      const day = parseInt(parts[2], 10);
      
      const months = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
      const monthName = months[monthIdx] || parts[1];
      const currentYear = new Date().getFullYear();

      return year === currentYear ? monthName + ' ' + day : monthName + ' ' + day + ', ' + year;
    }

    function formatTimeComponent(timeStr) {
      if (!timeStr) return { hour: 0, minute: 0, ampm: 'am', display: '' };
      const parts = timeStr.split(':');
      let hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1] || '0', 10);
      const ampm = hour >= 12 ? 'pm' : 'am';
      
      hour = hour % 12;
      if (hour === 0) hour = 12;

      const minStr = minute === 0 ? '' : ':' + (minute < 10 ? '0' + minute : minute);
      return { hour, minute, ampm, minStr, display: hour + minStr };
    }

    function formatReadableTimeRange(startTime, endTime) {
      if (!startTime) return '';
      const start = formatTimeComponent(startTime);

      if (!endTime || endTime === startTime) {
        return start.display + start.ampm;
      }

      const end = formatTimeComponent(endTime);

      if (start.ampm === end.ampm) {
        return start.display + '–' + end.display + end.ampm;
      }
      return start.display + start.ampm + '–' + end.display + end.ampm;
    }

    function renderPlan(data) {
      currentParsedEvents = data.events || [];
      const outputContainer = document.getElementById('outputContainer');
      const eventsContainer = document.getElementById('eventsContainer');
      const planSummary = document.getElementById('planSummary');
      const saveAllBtn = document.getElementById('saveAllBtn');

      if (data.summary_message) {
        planSummary.innerText = data.summary_message;
        planSummary.classList.remove('hidden');
      } else {
        planSummary.classList.add('hidden');
      }

      saveAllBtn.disabled = false;
      saveAllBtn.classList.remove('success');
      saveAllBtn.innerText = currentParsedEvents.length > 1 
        ? 'Add All (' + currentParsedEvents.length + ') to Calendar' 
        : 'Add to Calendar';

      eventsContainer.innerHTML = currentParsedEvents.map(ev => {
        const dateDisplay = formatReadableDate(ev.date);
        const timeDisplay = formatReadableTimeRange(ev.start_time, ev.end_time);
        return (
          '<div class="event-card" data-color="' + (ev.color_id || '9') + '">' +
            '<div class="event-title">' + (ev.title || 'New Event') + '</div>' +
            '<div class="event-detail"><span>Date:</span> <strong>' + dateDisplay + '</strong></div>' +
            '<div class="event-detail"><span>Time:</span> <strong>' + timeDisplay + '</strong></div>' +
            (ev.location ? '<div class="event-detail"><span>Location:</span> <strong>' + ev.location + '</strong></div>' : '') +
          '</div>'
        );
      }).join('');

      outputContainer.classList.remove('hidden');
    }

    async function commitAllEvents() {
      if (!currentParsedEvents.length) return;
      const saveBtn = document.getElementById('saveAllBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Adding to Calendar...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'INSERT', events: currentParsedEvents })
        });

        if (!response.ok) {
          const errData = await response.text();
          throw new Error('HTTP ' + response.status + ': ' + errData);
        }

        saveBtn.classList.add('success');
        saveBtn.innerText = currentParsedEvents.length > 1 ? '✓ All Events Added' : '✓ Added to Calendar';
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Retry Adding';
        alert('Failed: ' + err.message);
      }
    }

    async function processSchedule() {
      stopVoice();
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('submitBtn');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Planning...';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        if (!response.ok) {
          const errData = await response.text();
          throw new Error('HTTP ' + response.status + ': ' + errData);
        }

        const data = await response.json();
        renderPlan(data);

        input.value = '';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Process Request';
      }
    }

    // Hybrid Patience Speech Recognition
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const promptInput = document.getElementById('promptInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let silenceTimer = null;
    let isListening = false;

    function resetSilenceTimer() {
      if (silenceTimer) clearTimeout(silenceTimer);
      micStatus.innerText = 'Listening... (Speak freely, 6s pause allowed)';
      silenceTimer = setTimeout(() => {
        if (isListening && promptInput.value.trim().length > 0) {
          micStatus.innerText = 'Submitting your plan...';
          processSchedule();
        }
      }, 6000);
    }

    function stopVoice() {
      if (silenceTimer) clearTimeout(silenceTimer);
      if (recognition && isListening) {
        recognition.stop();
      }
      isListening = false;
      micBtn.classList.remove('listening');
      micStatus.innerText = '';
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        resetSilenceTimer();
      };

      recognition.onresult = function(event) {
        let finalTranscript = '';
        for (let i = 0; i < event.results.length; i++) {
          finalTranscript += event.results[i][0].transcript + ' ';
        }
        promptInput.value = finalTranscript.trim();
        resetSilenceTimer();
      };

      recognition.onerror = function(event) {
        console.error('Speech recognition error:', event.error);
        if (event.error !== 'no-speech') {
          stopVoice();
        }
      };

      recognition.onend = function() {
        if (isListening) {
          // Restart if closed prematurely by browser
          try { recognition.start(); } catch(e) { stopVoice(); }
        }
      };

      micBtn.addEventListener('click', function() {
        if (isListening) {
          stopVoice();
        } else {
          promptInput.value = '';
          try { recognition.start(); } catch(e) { console.error(e); }
        }
      });
    } else {
      micBtn.style.display = 'none';
    }

    document.getElementById('submitBtn').addEventListener('click', processSchedule);
    document.getElementById('promptInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        processSchedule();
      }
    });
  </script>
</body>
</html>
